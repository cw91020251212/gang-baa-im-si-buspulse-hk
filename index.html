<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="港巴即時｜BusPulse HK — 香港巴士實時到站牌">
<title>港巴即時｜BusPulse HK</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101827; --bg-deep:#0b1120; --card:rgba(26,36,55,.88); --card2:#22304a; --line:rgba(151,173,207,.16);
  --tx:#f4f7fb; --dim:#aab7cc; --faint:#71809a;
  --now:#36e0a0; --soon:#ffd166; --late:#85a9ff; --sched:#9aa8bd;
  --kmb:#ff625c; --ctb:#ffbe55; --gmb:#63d889;
  --accent:#6c8cff; --accent-2:#a77bff; --glow:rgba(108,140,255,.22);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(circle at 12% -8%, rgba(108,140,255,.22), transparent 34%), radial-gradient(circle at 100% 10%, rgba(167,123,255,.16), transparent 30%), var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  min-height:100vh; padding-bottom:calc(84px + var(--safe-b));
  -webkit-tap-highlight-color:transparent;
}
/* ---------- top bar ---------- */
.top{
  position:sticky; top:0; z-index:50; background:rgba(16,24,39,.84);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:calc(10px + var(--safe-t)) 14px 10px;
  display:flex; align-items:center; gap:10px;
}
.top h1{font-size:17px; font-weight:800; letter-spacing:.3px; flex:1; background:linear-gradient(100deg,#fff 20%,#a9baff); -webkit-background-clip:text; background-clip:text; color:transparent}
.brandmark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:10px;font-weight:900;letter-spacing:-.4px;box-shadow:0 5px 16px var(--glow)}
.brandcopy{flex:1;min-width:0}.brandcopy h1{line-height:1.1}.brandcopy small{display:block;color:var(--faint);font-size:9px;font-weight:700;letter-spacing:.45px;margin-top:3px}
.clock{font-variant-numeric:tabular-nums; font-size:13px; color:var(--dim); font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--now);flex:none}
.dot.stale{background:var(--soon)}
.dot.err{background:var(--kmb)}
.iconbtn{
  background:rgba(34,48,74,.82); border:1px solid var(--line); color:var(--tx);
  width:34px;height:34px;border-radius:10px; font-size:15px; cursor:pointer;
  display:grid;place-items:center; flex:none;
}
.iconbtn:active{background:#2a3240}
/* ---------- board ---------- */
.board{padding:12px 12px 0; display:flex; flex-direction:column; gap:10px}
.card{
  background:linear-gradient(135deg,rgba(29,41,63,.94),rgba(20,29,46,.94)); border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 28px rgba(3,8,20,.18);
  overflow:hidden; position:relative;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim)}
.card[data-co=KMB]::before{background:var(--kmb)}
.card[data-co=CTB]::before{background:var(--ctb)}
.card[data-co=GMB]::before{background:var(--gmb)}
.chead{display:flex; align-items:baseline; gap:8px; padding:11px 13px 8px 15px}
.rt{font-size:25px; font-weight:800; letter-spacing:-.5px; line-height:1}
.co{
  font-size:9px; font-weight:800; padding:2px 5px; border-radius:4px;
  letter-spacing:.5px; flex:none; transform:translateY(-2px);
}
.co.KMB{background:rgba(226,35,26,.16); color:#ff8079}
.co.CTB{background:rgba(245,166,35,.16); color:#ffc165}
.co.GMB{background:rgba(78,192,110,.16); color:#7fd897}
.dest{font-size:12.5px; color:var(--dim); flex:1; min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; text-align:right}
.stop{
  padding:0 13px 9px 15px; font-size:11.5px; color:var(--faint);
  display:flex; align-items:center; gap:5px;
}
.stop b{color:var(--dim); font-weight:600}.stop-edit{flex:1;min-width:0;border:0;background:none;color:var(--faint);padding:0;text-align:left;font:inherit;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stop-edit:hover b{text-decoration:underline;color:var(--text)}.fare{margin-left:auto;color:#ffd166;font-size:10.5px;font-weight:800;white-space:nowrap;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.2);padding:3px 6px;border-radius:6px}.fare-link{color:#a9c7ff;text-decoration:none;border-color:rgba(169,199,255,.35);cursor:pointer}.fare-link:hover{text-decoration:underline}
/* ---------- eta row ---------- */
.etas{display:flex; gap:7px; padding:0 13px 12px 15px; overflow-x:auto; scrollbar-width:none}
.etas::-webkit-scrollbar{display:none}
.eta{
  background:linear-gradient(145deg,rgba(39,54,82,.9),rgba(29,42,66,.9)); border:1px solid var(--line); border-radius:10px;
  padding:7px 11px; min-width:66px; flex:none; text-align:center;
}
.eta-main{display:flex;align-items:baseline;justify-content:center;gap:3px;min-height:22px;white-space:nowrap}.eta .m{font-size:21px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums}
.eta .u{font-size:9.5px; color:var(--faint); font-weight:600}
.eta .t{font-size:9.5px; color:var(--faint); margin-top:2px; font-variant-numeric:tabular-nums}
.eta.i0{border-color:rgba(0,229,138,.4); background:rgba(0,229,138,.08)}
.eta.i0 .m{color:var(--now)}
.eta.i1 .m{color:var(--soon)}
.eta.i2 .m{color:var(--late)}
.eta.arr{border-color:rgba(0,229,138,.55); background:rgba(0,229,138,.14)}
.eta.arr .m{font-size:15px; padding-top:3px}
.eta.sch{opacity:.62}
.eta.sch .m{color:var(--sched); font-size:18px}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
.alert-flash{animation:alertFlash .9s ease-in-out 12;border-color:#ffd166!important;box-shadow:0 0 0 3px rgba(255,209,102,.22),0 0 28px rgba(255,209,102,.35)!important}
@keyframes alertFlash{0%,100%{transform:scale(1)}50%{transform:scale(1.015);filter:brightness(1.3)}}
.alert-active .top{animation:topAlert .65s ease-in-out 12;border-bottom-color:#ff6262}.alert-active .dot{background:#ff6262;box-shadow:0 0 0 5px rgba(255,98,98,.22),0 0 18px rgba(255,98,98,.7)}
@keyframes topAlert{0%,100%{filter:brightness(1)}50%{filter:brightness(1.65);box-shadow:0 0 22px rgba(255,98,98,.45)}}
.getoff-btn{border:1px solid rgba(99,216,137,.32);background:rgba(99,216,137,.08);color:#a7f1bf;border-radius:8px;height:28px;padding:0 7px;font:700 11px/1 inherit;cursor:pointer;flex:none}.getoff-btn.on{background:rgba(99,216,137,.2);border-color:rgba(99,216,137,.65);color:#70f09b}.alarm-btn,.alight-btn{border:1px solid rgba(133,169,255,.28);background:rgba(108,140,255,.1);color:#b9c9ff;border-radius:8px;height:28px;padding:0 7px;font:700 16px/1 inherit;cursor:pointer;flex:none;position:relative}.alarm-btn:not(.on){color:#e5ecf7;background:rgba(220,230,245,.08);border-color:rgba(220,230,245,.4);filter:grayscale(1) brightness(1.45)}.alarm-btn:not(.on)::after{content:"";position:absolute;left:5px;right:5px;top:13px;height:2px;border-radius:2px;background:#e5ecf7;transform:rotate(-43deg)}.alarm-btn.on{background:rgba(255,209,102,.18);border-color:rgba(255,209,102,.55);color:#ffd166;filter:none}.alight-btn{font-size:11px;color:#a7f1bf;border-color:rgba(99,216,137,.3);background:rgba(99,216,137,.1)}
.pref-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:7px;font-size:12.5px}.pref-row small{display:block;color:var(--faint);font-size:10px;margin-top:3px}.pref-select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 8px;font:600 12px inherit}.toggle{width:44px;height:25px;border-radius:15px;border:1px solid var(--line);background:#3a465a;position:relative;cursor:pointer}.toggle::after{content:"";position:absolute;width:19px;height:19px;top:2px;left:2px;border-radius:50%;background:#cbd5e1;transition:.18s}.toggle.on{background:var(--now)}.toggle.on::after{left:21px;background:#071a14}
.test-tools{margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--card2)}.test-tools summary{cursor:pointer;padding:12px 2px;color:var(--muted);font-weight:800}.test-tools[open] summary{color:var(--now)}.test-tools .pref-row:first-of-type{margin-top:2px}.test-notify-row{display:flex;align-items:center;gap:8px}.test-notify-row .wide{flex:1}.test-countdown{display:inline-grid;place-items:center;min-width:54px;height:40px;padding:0 9px;border-radius:10px;background:#fff;color:#c62828;border:2px solid #ff6262;font:900 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.4px;box-shadow:0 0 0 2px rgba(255,98,98,.18);white-space:nowrap}.test-countdown.ready{color:var(--faint);border-color:var(--line);background:var(--card2);box-shadow:none;font-size:11px}
body.font-large .card{font-size:17px}body.font-large .rt{font-size:29px}body.font-large .dest{font-size:14px}body.font-large .stop{font-size:13.5px}body.font-large .stop b{font-size:14px}body.font-large .fare{font-size:12px}body.font-large .eta .m{font-size:25px}body.font-large .eta .u,body.font-large .eta .t{font-size:11px}body.font-large .rmk,body.font-large .none{font-size:12.5px}body.font-large .map-head-btn,body.font-large .alarm-btn{transform:scale(1.08)}body.font-large .foot{font-size:12px}body.font-large .sbody{font-size:15px}body.font-large .sbody .lbl{font-size:12px}body.font-large .sbody .hint{font-size:12.5px}body.font-large .sbody .li .n{font-size:18px}body.font-large .sbody .li .d{font-size:13.5px}body.font-large .sbody .sv .n{font-size:16.5px}body.font-large .sbody .sv .d{font-size:13px}body.font-large .sbody .wide{font-size:15px}body.font-large .sbody .pref-row{font-size:14.5px}body.font-large .sbody .pref-row small{font-size:11.5px}body.font-large .sbody .pref-select{font-size:14px}
body.font-large .clock{font-size:15px}body.font-large .brandcopy small{font-size:10.5px}body.font-large .iconbtn{font-size:17px}
body.light{--bg:#eef3fa;--bg-deep:#e1e9f4;--card:rgba(255,255,255,.92);--card2:#e4ebf5;--line:rgba(57,78,110,.18);--tx:#162238;--dim:#40516b;--faint:#6d7c91;--glow:rgba(70,100,180,.16);background:linear-gradient(145deg,#eef4ff,#f8fbff)}body.light .top{background:rgba(238,243,250,.88)}body.light .card{background:linear-gradient(135deg,#fff,#edf3fb)}body.light .sheet{background:linear-gradient(180deg,#f7faff,#e9f0f8)}
.map-actions{padding:0 13px 12px 15px}
.map-toggle{width:100%;border:1px solid rgba(133,169,255,.28);background:rgba(108,140,255,.1);color:#b9c9ff;border-radius:10px;padding:9px 11px;font:700 11.5px inherit;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.map-head-btn{width:28px;height:28px;border:1px solid rgba(133,169,255,.28);background:rgba(108,140,255,.1);color:#b9c9ff;border-radius:8px;font:700 14px inherit;cursor:pointer;flex:none}.map-head-btn:active{transform:scale(.94)}
.map-toggle:active{transform:scale(.99);background:rgba(108,140,255,.18)}
.map-toggle .map-arrow{font-size:15px;line-height:1;transition:transform .2s ease}.map-toggle.open .map-arrow{transform:rotate(180deg)}
.map-wrap{display:none;margin:0 13px 12px 15px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#dbe7ef}
.map-wrap.open{display:block}.map-tools{display:flex;gap:7px;padding:8px;background:rgba(16,24,39,.95)}.locate-btn{border:1px solid rgba(99,216,137,.35);background:rgba(99,216,137,.12);color:#a7f1bf;border-radius:9px;padding:8px 10px;font:700 11px inherit;cursor:pointer}.locate-btn:active{transform:scale(.98)}.route-map{height:250px;width:100%;z-index:1}.map-live-note{padding:7px 10px;background:rgba(0,229,138,.08);color:#a7f1bf;font-size:10.5px;line-height:1.45;border-top:1px solid rgba(99,216,137,.2)}.map-note{padding:7px 10px;background:rgba(16,24,39,.94);color:var(--faint);font-size:10px;line-height:1.4}
.map-loading{height:250px;display:grid;place-items:center;color:#53657e;font-size:12px}
.leaflet-container{font-family:inherit}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#17233a;color:#f4f7fb}.leaflet-popup-content{font-size:12px;line-height:1.5}.leaflet-control-zoom a{color:#23344e}.popup-select{margin-top:5px;border:0;border-radius:7px;padding:6px 9px;background:var(--now);color:#071a14;font:700 11px inherit;cursor:pointer}
.rmk{
  padding:0 13px 11px 15px; font-size:10.5px; color:var(--faint);
  display:flex; flex-wrap:wrap; gap:4px 8px;
}
.none{padding:2px 13px 13px 15px; font-size:12px; color:var(--faint)}
/* ---------- empty / footer ---------- */
.empty{padding:64px 26px; text-align:center; color:var(--faint)}
.empty .big{font-size:40px; margin-bottom:12px; opacity:.5}
.empty p{font-size:13.5px; line-height:1.75}
.foot{padding:20px 15px calc(20px + var(--safe-b)); text-align:center;
  font-size:10.5px; color:#3f4757; line-height:1.7}
/* ---------- fab ---------- */
.fab{
  position:fixed; right:16px; bottom:calc(18px + var(--safe-b)); z-index:60;
  background:linear-gradient(135deg,var(--now),#8af0c5); color:#071a14; border:none; border-radius:15px;
  height:50px; padding:0 20px; font-size:14.5px; font-weight:800; cursor:pointer;
  box-shadow:0 7px 24px rgba(0,229,138,.32); font-family:inherit;
}
.fab:active{transform:scale(.96)}
/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:99;
  opacity:0;pointer-events:none;transition:opacity .22s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed; left:0;right:0;bottom:0; z-index:100;
  background:linear-gradient(180deg,#17233a,var(--bg)); border-top:1px solid var(--line);
  border-radius:20px 20px 0 0; max-height:90vh; display:flex; flex-direction:column;
  transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;background:#39414f;border-radius:2px;margin:9px auto 3px;flex:none}
.shead{padding:8px 15px 12px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--line); flex:none}
.shead h2{font-size:15.5px; font-weight:700; flex:1}
.sbody{overflow-y:auto; padding:13px 15px calc(24px + var(--safe-b)); -webkit-overflow-scrolling:touch}
.lbl{font-size:10.5px; color:var(--faint); font-weight:700; letter-spacing:.7px;
  text-transform:uppercase; margin:16px 0 7px}
.lbl:first-child{margin-top:2px}
.segs{display:flex; gap:6px}
.seg{
  flex:1; background:var(--card); border:1px solid var(--line); color:var(--dim);
  padding:9px 4px; border-radius:9px; font-size:12.5px; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.seg.on{background:linear-gradient(135deg,rgba(108,140,255,.28),rgba(167,123,255,.2)); border-color:rgba(142,163,255,.65); color:var(--tx); box-shadow:0 5px 16px var(--glow)}
input.tin{
  width:100%; background:var(--card); border:1px solid var(--line); color:var(--tx);
  padding:12px 13px; border-radius:11px; font-size:16px; font-family:inherit;
  font-weight:600; letter-spacing:.5px;
}
input.tin:focus{outline:none;border-color:#4b566b}
input.tin::placeholder{color:#4b5566;font-weight:400;letter-spacing:0}
.hint{font-size:11px; color:var(--faint); margin-top:6px; line-height:1.6}
.list{display:flex; flex-direction:column; gap:6px; margin-top:4px}
.li{
  background:var(--card); border:1px solid var(--line); border-radius:11px;
  padding:11px 13px; cursor:pointer; display:flex; align-items:center; gap:10px;
  text-align:left; color:var(--tx); font-family:inherit; width:100%;
}
.li:active{background:var(--card2); transform:scale(.99)}
.li{transition:transform .15s ease, background .15s ease}
.li .n{font-size:16px;font-weight:800;min-width:44px;flex:none}
.li .d{font-size:11.5px;color:var(--dim);flex:1;min-width:0;line-height:1.5}
.li .d s{display:block;color:var(--faint);text-decoration:none;font-size:10.5px;margin-top:1px}
.li .a{font-size:15px;color:var(--faint);flex:none}
.li.sm .n{font-size:12.5px;min-width:26px;color:var(--dim)}
.msg{padding:22px 6px; text-align:center; color:var(--faint); font-size:12.5px; line-height:1.7}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
  border-top-color:var(--now);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-3px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
/* saved list */
.sv{
  background:var(--card); border:1px solid var(--line); border-radius:11px;
  padding:10px 12px; display:flex; align-items:center; gap:9px;
}
.sv .n{font-size:14.5px;font-weight:800;min-width:40px}
.sv .d{flex:1;min-width:0;font-size:11px;color:var(--dim);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis}
.sv .x{background:none;border:none;color:var(--faint);font-size:19px;
  cursor:pointer;padding:2px 5px;font-family:inherit;flex:none}
.sv .mv{background:none;border:none;color:var(--faint);font-size:14px;
  cursor:pointer;padding:2px 4px;font-family:inherit;flex:none}
.wide{
  width:100%; background:var(--card2); border:1px solid var(--line); color:var(--tx);
  padding:12px; border-radius:11px; font-size:13.5px; font-weight:700;
  cursor:pointer; font-family:inherit; margin-top:9px;
}
.backup-box{margin-top:12px;padding:10px;border:1px solid rgba(255,209,102,.28);border-radius:10px;background:rgba(255,209,102,.07);color:var(--dim);font-size:11px;line-height:1.45}.backup-box .wide{margin-top:7px}.backup-actions{display:flex;gap:7px}.backup-actions .wide{flex:1}.wide.danger{color:#ffaaa5;border-color:rgba(255,98,92,.3);background:rgba(255,98,92,.06)}
.wide.p{background:linear-gradient(135deg,var(--now),#8af0c5);color:#071a14;border-color:var(--now); box-shadow:0 7px 18px rgba(54,224,160,.18)}
.tag{
  display:inline-block; font-size:9.5px; font-weight:800; padding:2px 5px;
  border-radius:4px; letter-spacing:.4px; flex:none;
}
.tag.KMB{background:rgba(226,35,26,.16);color:#ff8079}
.tag.CTB{background:rgba(245,166,35,.16);color:#ffc165}
.tag.GMB{background:rgba(78,192,110,.16);color:#7fd897}
@media(min-width:620px){
  .board{max-width:600px;margin:0 auto;padding:14px 16px 0}
  .top{max-width:600px;margin:0 auto}
  .sheet{max-width:600px;margin:0 auto;border-radius:20px 20px 0 0}
}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
<div class="top">
  <span class="brandmark">BP</span>
  <div class="brandcopy"><h1>港巴即時</h1><small>BusPulse HK · 香港實時到站</small></div>
  <span class="dot" id="dot"></span>
  <span class="clock" id="clock">--:--:--</span>
  <button class="iconbtn" id="prefsBtn" title="顯示設定" aria-label="顯示設定">⚙</button>
  <button class="iconbtn" id="refreshBtn" title="即刻更新" aria-label="即刻更新">&#8635;</button>
</div>

<div class="board" id="board"></div>
<div class="foot">
  資料來源：data.gov.hk 實時到站 API<br>
  到站時間僅供參考，實際班次可能有變
</div>

<button class="fab" id="fab">＋ 設定路線</button>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead">
    <h2 id="sTitle">設定路線</h2>
    <button class="iconbtn" id="closeBtn" aria-label="關閉設定">✕</button>
  </div>
  <div class="sbody" id="sBody"></div>
</div>
<script>
'use strict';
/* ===================================================================
   巴士到站牌 — 三間公司 API adapter
   KMB : data.etabus.gov.hk/v1
   CTB : rt.data.gov.hk/v2/transport/citybus   (新巴已併入 CTB)
   GMB : data.etagmb.gov.hk                   (綠色專線小巴)
   =================================================================== */
const KMB = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB = 'https://rt.data.gov.hk/v2/transport/citybus';
const GMB = 'https://data.etagmb.gov.hk';

const CO_NAME = { KMB:'九巴', CTB:'城巴', GMB:'小巴' };
const REGION  = { HKI:'港島', KLN:'九龍', NT:'新界' };

/* ---- fetch with timeout + JSON ---- */
async function getJSON(url, ms = 12000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---- in-memory cache for static data (routes / stop names) ---- */
const memo = new Map();
function cached(key, fn) {
  if (!memo.has(key)) memo.set(key, fn().catch(e => { memo.delete(key); throw e; }));
  return memo.get(key);
}

/* =========================  ROUTE SEARCH  ========================= */
/* Returns array of variant objects, normalised across companies:
   { co, route, dirLabel, origin, dest, ...co-specific keys }        */

async function searchKMB(route) {
  const all = (await cached('kmb:routes', () => getJSON(KMB + '/route/'))).data;
  const R = route.toUpperCase();
  return all.filter(r => r.route.toUpperCase().startsWith(R)).map(r => ({
    co: 'KMB', route: r.route,
    bound: r.bound === 'O' ? 'outbound' : 'inbound',
    dir: r.bound, service_type: r.service_type,
    origin: r.orig_tc, dest: r.dest_tc,
    dirLabel: r.orig_tc + ' → ' + r.dest_tc,
    extra: r.service_type !== '1' ? '特別班次 ' + r.service_type : ''
  }));
}

async function searchCTBExact(route) {
  const R = route.toUpperCase();
  let info;
  try { info = (await getJSON(CTB + '/route/CTB/' + encodeURIComponent(R))).data; }
  catch { return []; }
  if (!info || !info.route) return [];
  const out = [];
  for (const b of ['inbound', 'outbound']) {
    let stops = [];
    try { stops = (await getJSON(CTB + '/route-stop/CTB/' + encodeURIComponent(R) + '/' + b)).data || []; }
    catch { continue; }
    if (!stops.length) continue;
    const fwd = b === 'outbound';
    out.push({
      co: 'CTB', route: info.route, bound: b, dir: fwd ? 'O' : 'I',
      origin: fwd ? info.orig_tc : info.dest_tc,
      dest:   fwd ? info.dest_tc : info.orig_tc,
      dirLabel: (fwd ? info.orig_tc : info.dest_tc) + ' → ' + (fwd ? info.dest_tc : info.orig_tc),
      extra: ''
    });
  }
  return out;
}

async function searchCTB(route) {
  const R = route.toUpperCase();
  let all = [];
  try { all = (await getJSON(CTB + '/route/CTB')).data || []; } catch { return []; }
  const matches = [...new Set(all.map(x => x.route).filter(x => x.toUpperCase().startsWith(R)))];
  const results = await Promise.all(matches.slice(0, 25).map(searchCTBExact));
  return results.flat();
}

async function searchGMB(route) {
  const R = route.toUpperCase();
  const out = [];
  for (const rg of ['HKI', 'KLN', 'NT']) {
    let codes = [];
    try { codes = (await getJSON(GMB + '/route/' + rg)).data?.routes || []; } catch { continue; }
    const matches = codes.filter(code => code.toUpperCase().startsWith(R)).slice(0, 25);
    for (const code of matches) {
      let rows;
      try { rows = (await getJSON(GMB + '/route/' + rg + '/' + encodeURIComponent(code))).data; } catch { continue; }
      for (const r of (rows || [])) {
        for (const d of (r.directions || [])) {
          out.push({
            co: 'GMB', route: r.route_code, region: r.region,
            route_id: r.route_id, route_seq: d.route_seq,
            origin: d.orig_tc, dest: d.dest_tc,
            dirLabel: d.orig_tc + ' → ' + d.dest_tc,
            extra: REGION[r.region] + (r.description_tc && r.description_tc !== '正常班次' ? ' · ' + r.description_tc : '')
          });
        }
      }
    }
  }
  return out;
}

function searchRoute(co, route) {
  if (co === 'KMB') return searchKMB(route);
  if (co === 'CTB') return searchCTB(route);
  return searchGMB(route);
}

/* =========================  STOP LIST  ========================= */
/* Returns [{ seq, id, name }] for a chosen route variant */

async function stopsKMB(v) {
  const rs = (await getJSON(
    KMB + '/route-stop/' + encodeURIComponent(v.route) + '/' + v.bound + '/' + v.service_type
  )).data;
  const names = await cached('kmb:stops', () => getJSON(KMB + '/stop').then(d => {
    const m = new Map(); d.data.forEach(s => m.set(s.stop, { name: s.name_tc, lat: +s.lat, lng: +s.long })); return m;
  }));
  return rs.map(s => { const info = names.get(s.stop) || {}; return { seq: +s.seq, id: s.stop, name: info.name || s.stop, lat: info.lat, lng: info.lng }; });
}

async function stopsCTB(v) {
  const rs = (await getJSON(
    CTB + '/route-stop/CTB/' + encodeURIComponent(v.route) + '/' + v.bound
  )).data;
  const out = await Promise.all(rs.map(async s => {
    let nm = s.stop, lat, lng;
    try {
      const info = (await cached('ctb:stop:' + s.stop, () => getJSON(CTB + '/stop/' + s.stop))).data || {};
      nm = info.name_tc || s.stop; lat = +(info.lat || info.latitude); lng = +(info.long || info.lng || info.longitude);
    } catch {}
    return { seq: +s.seq, id: s.stop, name: nm, lat, lng };
  }));
  return out;
}

async function stopsGMB(v) {
  const d = (await getJSON(GMB + '/route-stop/' + v.route_id + '/' + v.route_seq)).data;
  return (d.route_stops || []).map(s => ({
    seq: +s.stop_seq, id: String(s.stop_id), name: s.name_tc,
    lat: +(s.lat || s.latitude), lng: +(s.long || s.lng || s.longitude)
  }));
}

function routeStops(v) {
  if (v.co === 'KMB') return stopsKMB(v);
  if (v.co === 'CTB') return stopsCTB(v);
  return stopsGMB(v);
}

/* =========================  ETA  ========================= */
/* Returns { etas:[{iso, min, rmk, sched}], err } — sorted, future only */

function minsFrom(iso) {
  return Math.round((new Date(iso).getTime() - Date.now()) / 60000);
}

async function etaKMB(it) {
  const d = (await getJSON(
    KMB + '/route-eta/' + encodeURIComponent(it.route) + '/' + it.service_type
  )).data;
  return d.filter(e =>
      e.seq === it.seq && e.dir === it.dir && e.eta
    ).map(e => ({
      iso: e.eta, min: minsFrom(e.eta),
      rmk: e.rmk_tc || '', sched: /原定|預定|Scheduled/i.test(e.rmk_tc || '')
    }));
}

async function etaCTB(it) {
  const d = (await getJSON(
    CTB + '/eta/CTB/' + it.stopId + '/' + encodeURIComponent(it.route)
  )).data;
  return (d || []).filter(e => e.eta && e.dir === it.dir).map(e => ({
    iso: e.eta, min: minsFrom(e.eta),
    rmk: e.rmk_tc || '', sched: /原定|預定|Scheduled/i.test(e.rmk_tc || '')
  }));
}

async function etaGMB(it) {
  const d = (await getJSON(
    GMB + '/eta/route-stop/' + it.route_id + '/' + it.route_seq + '/' + it.seq
  )).data;
  const rows = Array.isArray(d) ? (d[0] ? d[0].eta : []) : (d.eta || []);
  return (rows || []).filter(e => e.timestamp).map(e => ({
    iso: e.timestamp, min: e.diff != null ? Math.round(e.diff) : minsFrom(e.timestamp),
    rmk: e.remarks_tc || '', sched: false
  }));
}

async function fetchETA(it) {
  try {
    let list = it.co === 'KMB' ? await etaKMB(it)
             : it.co === 'CTB' ? await etaCTB(it)
             : await etaGMB(it);
    list = list.filter(e => e.min >= -2).sort((a, b) => a.min - b.min).slice(0, 4);
    return { etas: list, err: null };
  } catch (e) {
    return { etas: [], err: e.name === 'AbortError' ? '連線超時' : '讀取失敗' };
  }
}

function importBackup(file) {

    try {

    } catch { alert('呢份檔案唔係有效嘅 BusPulse HK 備份。'); }

// Keep a short-lived ETA snapshot so a temporary API/network failure does not
// erase the user's countdown or cancel an alarm that was already knowable.
const ETA_CACHE_KEY = 'busboard.eta-snapshot.v1';
const ETA_CACHE_MAX_AGE = 20 * 60 * 1000;
function loadEtaSnapshots() { try { const raw = JSON.parse(localStorage.getItem(ETA_CACHE_KEY) || '{}'); return raw && typeof raw === 'object' ? raw : {}; } catch { return {}; } }
let etaSnapshots = loadEtaSnapshots();

function cacheEta(id, etas) { if (!etas?.length) return; etaSnapshots[id] = { savedAt: Date.now(), etas: etas.map(e => ({...e})) }; saveEtaSnapshots(); }
function cachedEta(id) {
  const entry = etaSnapshots[id];
  if (!entry || Date.now() - Number(entry.savedAt) > ETA_CACHE_MAX_AGE || !Array.isArray(entry.etas)) return null;
  const etas = entry.etas.map(e => ({...e, min: e.iso ? Math.round((Date.parse(e.iso) - Date.now()) / 60000) : e.min}))
    .filter(e => e.iso && Number.isFinite(Date.parse(e.iso)) && e.min >= -2);
  return etas.length ? { etas, err: null, stale: true, cachedAt: entry.savedAt } : null;
}

    if (line.length > 1) {
      const lats = valid.map(x => x.lat), lngs = valid.map(x => x.lng);
      const minLat = Math.min(...lats) - .03, maxLat = Math.max(...lats) + .03;
      const minLng = Math.min(...lngs) - .03, maxLng = Math.max(...lngs) + .03;
      const outside = line.some(x => x[1] < minLat || x[1] > maxLat || x[0] < minLng || x[0] > maxLng);
      const directKm = valid.slice(1).reduce((sum, x, i) => {
        const a = valid[i], dy = (x.lat-a.lat)*111, dx = (x.lng-a.lng)*102;
        return sum + Math.hypot(dx, dy);
      }, 0);
      const routeKm = Number(d.routes?.[0]?.distance || 0) / 1000;
      // Reject implausible detours (e.g. E41 being routed towards Zhuhai/Macau).
      if (!outside && (!routeKm || routeKm <= Math.max(80, directKm * 3.2))) return line.map(x => [x[1], x[0]]);
    }
  } catch {}
  return valid.map(x => [x.lat, x.lng]);
}

let setupMapInstance = null;

function nearestStop(stops, lat, lng) {
  return stops.reduce((best, st) => {
    const d = Math.pow(st.lat - lat, 2) + Math.pow(st.lng - lng, 2);
    return !best || d < best.d ? { st, d } : best;
  }, null)?.st;
}

function locateOnMap(map, stops, button) {
  if (!navigator.geolocation) { button.textContent = '此瀏覽器不支援定位'; return; }
  button.textContent = '⌖ 定位中…';
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (window.__userMarker) window.__userMarker.remove();
    window.__userMarker = L.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#ff625c', fillOpacity: .95 }).addTo(map).bindPopup('<b>你目前位置</b>').openPopup();
    map.setView([lat, lng], 17);
    const near = nearestStop(stops, lat, lng);
    if (near) map.eachLayer(layer => { if (layer.getLatLng && Math.abs(layer.getLatLng().lat-near.lat)<1e-8 && Math.abs(layer.getLatLng().lng-near.lng)<1e-8) layer.openPopup(); });
    button.textContent = '⌖ 已定位到附近';
  }, () => { button.textContent = '⌖ 定位失敗，請允許 GPS'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}

function toggleLiveRouteGPS(it, map, stops, button) {
  const id = uid(it);
  const current = liveMapStates.get(id);
  if (current?.watch != null) {
    navigator.geolocation.clearWatch(current.watch); current.watch = null; liveMapStates.set(id, current);
    button.textContent = '⌖ 開啟 GPS';
    const note = document.querySelector('[data-live-note="' + cssEscape(id) + '"]'); if (note) note.textContent = 'GPS 已停止；需要時可以再次撳「開啟 GPS」。';
    return;
  }
  if (!navigator.geolocation) { button.textContent = '此手機不支援 GPS'; return; }
  button.textContent = '⌖ 定位中…';
  const state = current || { marker:null, centered:false, watch:null };
  const valid = stops.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
  state.watch = navigator.geolocation.watchPosition(pos => {
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    if (!state.marker) state.marker=L.circleMarker([lat,lng], { radius:8, color:'#fff', weight:3, fillColor:'#ff625c', fillOpacity:.95 }).addTo(map);
    else state.marker.setLatLng([lat,lng]);
    // 導航式跟隨：每次 GPS 更新都保持用家位置在畫面內，唔會只定位一次。
    map.setView([lat,lng], Math.max(map.getZoom(), 15), { animate:false });
    state.centered=true;
    const near=nearestStop(valid,lat,lng);
    const idx=near ? valid.findIndex(x => x.seq === near.seq) : -1;
    const next=idx >= 0 ? valid[idx+1] : null;
    const note=document.querySelector('[data-live-note="' + cssEscape(id) + '"]');
    if (note) note.textContent = near ? ('你目前接近：第 ' + near.seq + ' 站「' + near.name + '」' + (next ? '｜下一站：第 ' + next.seq + ' 站「' + next.name + '」' : '｜已接近尾站') + '｜地圖跟住你') : 'GPS 已開啟，地圖會跟住你移動…';
    button.textContent='⌖ GPS 跟住我';
  }, () => { button.textContent='⌖ GPS 失敗，請允許定位'; }, { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
  liveMapStates.set(id,state);
}

function locateOnExistingMap(it) {

function paint(it, res) {
  const slot = board.querySelector('[data-slot="' + cssEscape(uid(it)) + '"]');
  if (!slot) return;
  const card = slot.closest('.card');
  const old = card.querySelector('.rmk, .none');
  if (old) old.remove();

  if (res.err && !res.stale) {
    slot.innerHTML = '<div class="eta"><div class="m" style="font-size:14px;color:var(--faint)">—</div>' +
                     '<div class="u">' + esc(res.err) + '</div></div>';
    return;
  }
  if (!res.etas.length) {
    slot.innerHTML = '';
    card.insertAdjacentHTML('beforeend', '<div class="none">暫時冇班次資料（可能已收車）</div>');
    return;
  }
  slot.innerHTML = res.etas.map((e, i) => {
    const liveMin = e.iso && Number.isFinite(Date.parse(e.iso)) ? Math.round((Date.parse(e.iso) - Date.now()) / 60000) : e.min;
    const hhmm = new Date(e.iso).toLocaleTimeString('en-GB',
      { hour:'2-digit', minute:'2-digit', hour12:false });
    const cls = ['eta', 'i' + Math.min(i, 2)];
    if (e.sched) cls.push('sch');
    let big;
    if (liveMin <= 0) { cls.push('arr'); big = '<div class="eta-main"><div class="m">即將到達</div></div>'; }
    else            { big = '<div class="eta-main"><div class="m">' + liveMin + '</div><div class="u">分鐘</div></div>'; }
    return '<div class="' + cls.join(' ') + '">' + big +
           '<div class="t">' + hhmm + '</div></div>';
  }).join('');

  const rmks = [...new Set(res.etas.map(e => e.rmk).filter(Boolean))];
  if (res.stale) rmks.unshift('網絡暫時中斷，以下按上次估算倒數');
  if (rmks.length) {
    card.insertAdjacentHTML('beforeend',
      '<div class="rmk">' + rmks.map(r => '<span>&#9432; ' + esc(r) + '</span>').join('') + '</div>');
  }
}

async function refresh() {
  if (inFlight || !items.length) return;
  inFlight = true;
  try {
    dot.className = 'dot';
    const snapshot = items.slice();
    const results = await Promise.all(snapshot.map(fetchETA));
    snapshot.forEach((it, i) => {
      if (items.some(x => uid(x) === uid(it))) {
        const id = uid(it), fresh = results[i];
        if (!fresh.err && fresh.etas.length) cacheEta(id, fresh.etas);
        const fallback = fresh.err || !fresh.etas.length ? cachedEta(id) : null;
        const display = fallback || fresh;
        latestResults.set(id, display);
        paint(it, display);
        scheduleAlarmFallbacks(it, display, { stale: !!display.stale });
        checkAlarms(it, display);
      }
    });
    renderPip();
    const anyOK = results.some(r => !r.err);
    if (anyOK) lastOK = Date.now();
    dot.className = 'dot' + (anyOK ? '' : ' err');
  } catch (e) {
    // Keep the 25-second loop alive if an unexpected rendering/notification
    // error escapes one of the per-route handlers.
    dot.className = 'dot err';
    console.warn('BusPulse refresh failed', e);
  } finally {
    inFlight = false;
  }
}

  $('#clearAlarmsBtn').addEventListener('click', clearAllArrivalAlarms);
  $('#saveDefaultBtn').addEventListener('click', () => {
    if (!items.length) { alert('請先加入至少一條路線，先可以儲存為預設。'); return; }
    userDefaults = items.map(x => ({...x})); saveUserDefaults(); viewHome();
  });
  $('#loadDefaultBtn').addEventListener('click', () => {
    if (!userDefaults.length) return;
    if (!confirm('確定要使用預設路線嗎？目前畫面上嘅路線會被預設清單取代，但唔會刪除你已儲存嘅預設。')) return;
    items = userDefaults.map(x => ({...x})); save(); shell(); refresh(); viewHome();
  });
  $('#clearDefaultBtn').addEventListener('click', () => {
    if (!userDefaults.length) return;
    if (!confirm('確定要清除自訂預設路線嗎？目前路線唔會受影響。')) return;
    userDefaults = []; saveUserDefaults(); viewHome();
  });
  if (deferredPrompt) {
    const ib = $('#installBtn');
    ib.style.display = 'block';
    ib.addEventListener('click', doInstall);
  }
}

/* ---------- view 2: search route number ---------- */
function viewSearch() {
  sTitle.textContent = '加新路線';
  sBody.innerHTML =
    '<div class="lbl">巴士公司</div>' +
    '<div class="segs" id="segs">' +
      ['KMB','CTB','GMB'].map(c =>
        '<button class="seg' + (c === pickCo ? ' on' : '') + '" data-co="' + c + '">' +
        (c === 'KMB' ? '九巴／龍運' : c === 'CTB' ? '城巴／新巴' : '綠色小巴') +
        '</button>').join('') +
    '</div>' +
    '<div class="lbl">路線號碼</div>' +
    '<input class="tin" id="rIn" placeholder="例如 1A、89、往 108…" autocomplete="off" ' +
      'autocapitalize="characters" enterkeyhint="search">' +
    '<div class="hint" id="rHint">輸入號碼然後揿「搵路線」。小巴只有綠色專線小巴有實時數據。</div>' +
    '<button class="wide p" id="goBtn">搵路線</button>' +
    '<div id="rOut"></div>' +
    '<button class="wide" id="backBtn">← 返回</button>';
  sBody.scrollTop = 0;

  sBody.querySelectorAll('.seg').forEach(b => b.addEventListener('click', () => {
    pickCo = b.dataset.co;
    sBody.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === b));
    $('#rOut').innerHTML = '';
  }));
  $('#backBtn').addEventListener('click', viewHome);
  const inp = $('#rIn');
  $('#goBtn').addEventListener('click', () => doSearch(inp.value.trim()));
  let searchTimer;
  inp.addEventListener('input', () => { clearTimeout(searchTimer); const q = inp.value.trim(); if (!q) { $('#rOut').innerHTML = ''; return; } searchTimer = setTimeout(() => doSearch(q), 380); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(inp.value.trim()); } });
  setTimeout(() => inp.focus(), 260);
}

async function doSearch(q) {
  const out = $('#rOut');
  if (!q) { out.innerHTML = '<div class="msg">請輸入路線號碼</div>'; return; }
  out.innerHTML = '<div class="msg"><span class="spin"></span>搵緊 ' + esc(q) + ' …</div>';
  let vs = [];
  try { vs = await searchRoute(pickCo, q); }
  catch { out.innerHTML = '<div class="msg">讀取失敗，請檢查網絡再試</div>'; return; }
  vs.sort((a, b) => (a.dirLabel || '').localeCompare(b.dirLabel || '', 'zh-HK'));
  if (!vs.length) {
    out.innerHTML = '<div class="msg">搵唔到 <b>' + esc(q.toUpperCase()) + '</b><br>' +
      '睇下係唔係揀錯公司，或者號碼有冇打錯</div>';
    return;
  }
  window.__vs = vs;
  out.innerHTML = '<div class="lbl">揀方向（' + vs.length + '）</div><div class="list">' +
    vs.map((v, i) =>
      '<button class="li" data-v="' + i + '">' +
        '<span class="n">' + esc(v.route) + '</span>' +
        '<span class="d">' + esc(v.dirLabel) +
          (v.extra ? '<s>' + esc(v.extra) + '</s>' : '') + '</span>' +
        '<span class="a">›</span>' +
      '</button>').join('') + '</div>';
  out.querySelectorAll('[data-v]').forEach(b =>
    b.addEventListener('click', () => viewStops(window.__vs[+b.dataset.v])));
}

/* ---------- view 3: pick stop ---------- */
function editBoardStop(it) {
  openSheet();
  viewStops({...it, editId:uid(it), dirLabel:'目前路線：往 ' + (it.dest || '')});
}
async function viewStops(v) {
  sTitle.textContent = v.route + (v.editId ? ' — 更改上車站' : ' — 揀站頭');
  sBody.innerHTML = '<div class="msg"><span class="spin"></span>載入站頭 …</div>';
  sBody.scrollTop = 0;
  let stops;
  try { stops = await routeStops(v); }
  catch {
    sBody.innerHTML = '<div class="msg">站頭讀取失敗</div>' +
      '<button class="wide" id="bk">← 返回</button>';
    $('#bk').addEventListener('click', viewSearch);
    return;
  }
  setupMapInstance = null;
  routeStopsCache.set(uid({co:v.co, route:v.route, dir:v.dir, stopId:'__setup__'}), stops);
  sBody.innerHTML =
    '<div class="lbl">' + esc(v.dirLabel) + '</div>' +
    '<div class="map-actions" style="padding:0 0 10px"><button class="map-toggle" id="setupMapBtn"><span>🗺 先睇全條路線地圖</span><span class="map-arrow">⌄</span></button></div>' +
    '<div class="map-wrap" id="setupMapWrap"><div class="map-tools"><button class="locate-btn" id="locateBtn">⌖ 定位我附近</button></div><div class="route-map"></div><div class="map-note">藍線按道路網絡模擬，撳任何站點可以睇站名。</div></div>' +
    '<div class="hint" style="margin:0 0 10px">' + (v.editId ? '揀新上車站，會直接更新原有路線卡，不會新增路線。' : '睇完地圖後，揀你上車嗰個站') + '（' + stops.length + ' 個）</div>' +
    '<div class="list">' + stops.map((s, i) =>
      '<button class="li sm" data-s="' + i + '">' +
        '<span class="n">' + s.seq + '</span>' +
        '<span class="d">' + esc(s.name) + '</span>' +
        '<span class="a">＋</span>' +
      '</button>').join('') + '</div>' +
    '<button class="wide" id="bk">← 返回</button>';
  $('#setupMapBtn').addEventListener('click', () => showSetupMap(v, stops, $('#setupMapBtn')));
  $('#bk').addEventListener('click', v.editId ? viewHome : viewSearch);
  sBody.querySelectorAll('[data-s]').forEach(b =>
    b.addEventListener('click', () => addItem(v, stops[+b.dataset.s])));
}

function addItem(v, s) {
  if (v.editId) {
    const index = items.findIndex(x => uid(x) === v.editId);
    if (index < 0) { viewHome(); return; }
    const oldId = uid(items[index]);
    const next = {...items[index], seq:s.seq, stopId:s.id, stopName:s.name};
    const newId = uid(next);
    if (oldId !== newId) {
      if (alarms[oldId] != null) { alarms[newId] = alarms[oldId]; delete alarms[oldId]; }
      if (getoff[oldId] != null) { getoff[newId] = getoff[oldId]; delete getoff[oldId]; }
    }
    items[index] = next; save(); saveAlarms(); saveGetoff(); shell(); refresh(); viewHome(); return;
  }
  const it = v.co === 'GMB'
    ? { co:'GMB', route:v.route, region:v.region, route_id:v.route_id,
        route_seq:v.route_seq, seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest }
    : v.co === 'KMB'
    ? { co:'KMB', route:v.route, bound:v.bound, dir:v.dir, service_type:v.service_type,
        seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest }
    : { co:'CTB', route:v.route, bound:v.bound, dir:v.dir,
        seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest };
  if (items.some(x => uid(x) === uid(it))) { viewHome(); return; }
  items.push(it); save(); shell(); refresh(); viewHome();
}

/* ===================================================================
   PWA INSTALL
   =================================================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
async function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ===================================================================
   BOOT
   =================================================================== */
shell();
startLoop();
</script>
