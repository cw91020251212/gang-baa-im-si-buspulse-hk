<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101827; --bg-deep:#0b1120; --card:rgba(26,36,55,.88); --card2:#22304a; --line:rgba(205,222,245,.28);
  --tx:#f4f7fb; --dim:#aab7cc; --faint:#71809a;
  --now:#36e0a0; --soon:#ffd166; --late:#85a9ff; --sched:#9aa8bd;
  --kmb:#ff625c; --ctb:#ffbe55; --gmb:#63d889;
  --accent:#6c8cff; --accent-2:#a77bff; --glow:rgba(108,140,255,.22);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%}
body{
  background:radial-gradient(circle at 12% -8%, rgba(108,140,255,.22), transparent 34%), radial-gradient(circle at 100% 10%, rgba(167,123,255,.16), transparent 30%), var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  min-height:100vh; padding-bottom:calc(84px + var(--safe-b));
  -webkit-tap-highlight-color:transparent;
}
/* ---------- top bar ---------- */
.top{
  position:sticky; top:0; z-index:50; background:rgba(16,24,39,.84);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  padding:calc(10px + var(--safe-t)) 14px 10px;
  display:flex; align-items:center; gap:10px;
}
.top h1{font-size:17px; font-weight:800; letter-spacing:.3px; flex:1; background:linear-gradient(100deg,#fff 20%,#a9baff); -webkit-background-clip:text; background-clip:text; color:transparent}
.brandmark{width:31px;height:31px;border-radius:10px;display:block;flex:none;background:url('icon-192.png') center/cover no-repeat;box-shadow:0 5px 16px var(--glow)}
.brandcopy{flex:1;min-width:0}.brandcopy h1{line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandcopy small{display:block;color:var(--faint);font-size:9px;font-weight:700;letter-spacing:.45px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-variant-numeric:tabular-nums; font-size:13px; color:var(--dim); font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--now);flex:none}
.dot.stale{background:var(--soon)}
.dot.err{background:var(--kmb)}
.iconbtn{
  background:rgba(34,48,74,.82); border:1px solid var(--line); color:var(--tx);
  width:34px;height:34px;border-radius:10px; font-size:15px; cursor:pointer;
  display:grid;place-items:center; flex:none;
}
.iconbtn:active{background:#2a3240}.iconbtn.loading{animation:sp .7s linear infinite;opacity:.7}.iconbtn.no-data{animation:sp .45s ease-in-out 2}
@media(max-width:500px){
  .top{display:flex;align-items:center;gap:6px;padding-left:10px;padding-right:10px;min-height:52px}
  .top .brandcopy{flex:1;min-width:0}
  .top .clock{font-size:12px}
  .top .iconbtn{width:32px;height:32px;flex:none}
  .top .top-add-route{height:40px;padding:0 10px;font-size:22px;flex:none}
}
/* ---------- board ---------- */
.board{padding:12px 12px 0; display:flex; flex-direction:column; gap:10px}
.card{
  background:linear-gradient(135deg,rgba(29,41,63,.94),rgba(20,29,46,.94)); border:1px solid rgba(205,222,245,.52); border-radius:18px; box-shadow:0 10px 28px rgba(3,8,20,.18);
  overflow:hidden; position:relative;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim)}
.card[data-co=KMB]::before{background:var(--kmb)}
.card[data-co=CTB]::before{background:var(--ctb)}
.card[data-co=GMB]::before{background:var(--gmb)}
.chead{display:flex; align-items:center; gap:8px; padding:11px 13px 8px 15px}
.rt{font-size:32px; font-weight:900; letter-spacing:-.7px; line-height:.95}
.co{
  font-size:9px; font-weight:800; padding:2px 5px; border-radius:4px;
  letter-spacing:.5px; flex:none; transform:translateY(-2px);
}
.co.KMB{background:rgba(226,35,26,.16); color:#ff8079}
.co.CTB{background:rgba(245,166,35,.16); color:#ffc165}
.co.GMB{background:rgba(78,192,110,.16); color:#7fd897}
.dest{font-size:12.5px; color:var(--dim); flex:1; min-width:0; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; text-align:right}
.chead-actions{display:flex;align-items:center;gap:5px;flex:none;margin-left:2px}
.chead-actions>button{box-sizing:border-box;height:28px;min-height:28px;margin:0;transform:none!important;display:grid;place-items:center;align-self:center}
.chead-actions .getoff-btn{width:auto;min-width:28px;padding:0 7px;font-size:11px;line-height:1;white-space:nowrap}
.chead-actions .alarm-btn,.chead-actions .map-head-btn{width:28px;padding:0;font-size:15px;line-height:1}
.stop{
  padding:0 13px 9px 15px; font-size:11.5px; color:var(--faint);
  display:flex; align-items:center; gap:5px;
}
.stop b{color:var(--dim); font-weight:600}.stop-edit{flex:1;min-width:0;border:0;background:none;color:var(--faint);padding:0;text-align:left;font:inherit;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stop-edit:hover b{text-decoration:underline;color:var(--text)}.fare{margin-left:auto;color:#ffd166;font-size:10.5px;font-weight:800;white-space:nowrap;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.2);padding:3px 6px;border-radius:6px}.fare-link{color:#a9c7ff;text-decoration:none;border-color:rgba(169,199,255,.35);cursor:pointer}.fare-link:hover{text-decoration:underline}
/* ---------- eta row ---------- */
.etas{display:flex; gap:7px; padding:0 13px 12px 15px; overflow-x:auto; scrollbar-width:none}
.etas::-webkit-scrollbar{display:none}
.eta{
  background:linear-gradient(145deg,rgba(39,54,82,.9),rgba(29,42,66,.9)); border:1px solid var(--line); border-radius:10px;
  padding:8px 8px 7px; min-width:0; min-height:68px; flex:0.82 1 0; display:flex; flex-direction:column; justify-content:center; text-align:center;
}
.eta:first-child{flex:1.55 1 0}
.eta:first-child .m{font-size:29px}
.eta:first-child .u,.eta:first-child .t{font-size:11.5px}
.eta-empty{background:rgba(39,54,82,.3);border-style:dashed;opacity:.72}
.eta-main{display:flex;align-items:baseline;justify-content:center;gap:4px;min-height:30px;white-space:nowrap}.eta .m{font-size:26px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums}
.eta .u{font-size:10.5px; color:var(--faint); font-weight:600}
.eta .t{font-size:11px; color:var(--faint); margin-top:5px; font-variant-numeric:tabular-nums}
.eta.i0{border-color:rgba(0,229,138,.4); background:rgba(0,229,138,.08)}
.eta.i0 .m{color:var(--now)}
.eta.i1 .m{color:var(--soon)}
.eta.i2 .m{color:var(--late)}
.eta.arr{border-color:rgba(0,229,138,.55); background:rgba(0,229,138,.14)}
.eta.arr .m{font-size:18px; padding-top:3px}
.eta.sch{opacity:.62}
.eta.sch .m{color:var(--sched); font-size:18px}
.etas .eta:first-child .m{font-size:40px!important;font-weight:900!important;line-height:.98}
.etas .eta:first-child .u,.etas .eta:first-child .t{font-size:12px}
.etas .eta:first-child.arr .m{font-size:30px!important}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
.alert-flash{animation:alertFlash .9s ease-in-out 12;border-color:#ffd166!important;box-shadow:0 0 0 3px rgba(255,209,102,.22),0 0 28px rgba(255,209,102,.35)!important}
@keyframes alertFlash{0%,100%{transform:scale(1)}50%{transform:scale(1.015);filter:brightness(1.3)}}
.alert-active .top{animation:topAlert .65s ease-in-out 12;border-bottom-color:#ff6262}.alert-active .dot{background:#ff6262;box-shadow:0 0 0 5px rgba(255,98,98,.22),0 0 18px rgba(255,98,98,.7)}
@keyframes topAlert{0%,100%{filter:brightness(1)}50%{filter:brightness(1.65);box-shadow:0 0 22px rgba(255,98,98,.45)}}
.getoff-btn{border:1px solid rgba(99,216,137,.32);background:rgba(99,216,137,.08);color:#a7f1bf;border-radius:8px;height:28px;padding:0 7px;font:700 11px/1 inherit;cursor:pointer;flex:none;position:relative}.getoff-btn.on{background:rgba(99,216,137,.2);border-color:rgba(99,216,137,.65);color:#70f09b}.alarm-btn,.alight-btn{border:1px solid rgba(133,169,255,.28);background:rgba(108,140,255,.1);color:#b9c9ff;border-radius:8px;height:28px;padding:0 7px;font:700 16px/1 inherit;cursor:pointer;flex:none;position:relative}.alarm-btn:not(.on){color:#e5ecf7;background:rgba(220,230,245,.08);border-color:rgba(220,230,245,.4);filter:grayscale(1) brightness(1.45)}.alarm-btn:not(.on)::after{content:"";position:absolute;left:5px;right:5px;top:13px;height:2px;border-radius:2px;background:#e5ecf7;transform:rotate(-43deg)}.alarm-btn.on{background:rgba(255,209,102,.18);border-color:rgba(255,209,102,.55);color:#ffd166;filter:none}.alight-btn{font-size:11px;color:#a7f1bf;border-color:rgba(99,216,137,.3);background:rgba(99,216,137,.1)}
.pref-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:7px;font-size:12.5px}.pref-row small{display:block;color:var(--faint);font-size:10px;margin-top:3px}.pref-select{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 8px;font:600 12px inherit}.toggle{width:44px;height:25px;border-radius:15px;border:1px solid var(--line);background:#3a465a;position:relative;cursor:pointer}.toggle::after{content:"";position:absolute;width:19px;height:19px;top:2px;left:2px;border-radius:50%;background:#cbd5e1;transition:.18s}.toggle.on{background:var(--now)}.toggle.on::after{left:21px;background:#071a14}
.diag-title{margin:14px 0 7px;font-weight:800;font-size:12px;color:var(--dim)}
.diag-box{border:1px solid var(--line);border-radius:11px;padding:4px 11px;background:var(--card);margin-bottom:8px}
.diag-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:12px;border-bottom:1px solid var(--line)}
.diag-row:last-child{border-bottom:none}
.diag-row span{color:var(--dim)}
.diag-row b{color:var(--tx);font-variant-numeric:tabular-nums;text-align:right}
.diag-warn{margin:8px 0;padding:9px 10px;border-radius:9px;background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.4);color:#ffd166;font-size:11.5px;line-height:1.5}
.diag-log{font-size:11px;color:var(--faint);padding:4px 0;font-variant-numeric:tabular-nums}
.test-tools{margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--card2)}.test-tools summary{cursor:pointer;padding:12px 2px;color:var(--muted);font-weight:800}.test-tools[open] summary{color:var(--now)}.test-tools .pref-row:first-of-type{margin-top:2px}.test-notify-row{display:flex;align-items:center;gap:8px}.test-notify-row .wide{flex:1}.test-countdown{display:inline-grid;place-items:center;min-width:54px;height:40px;padding:0 9px;border-radius:10px;background:#fff;color:#c62828;border:2px solid #ff6262;font:900 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.4px;box-shadow:0 0 0 2px rgba(255,98,98,.18);white-space:nowrap}.test-countdown.ready{color:var(--faint);border-color:var(--line);background:var(--card2);box-shadow:none;font-size:11px}

  padding:10px 12px; display:flex; align-items:center; gap:9px;
}
.sv .n{font-size:14.5px;font-weight:800;min-width:40px}
.sv .d{flex:1;min-width:0;font-size:11px;color:var(--dim);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis}
.sv .x{background:none;border:none;color:var(--faint);font-size:19px;
  cursor:pointer;padding:2px 5px;font-family:inherit;flex:none}
.sv .mv{background:none;border:none;color:var(--faint);font-size:14px;
  cursor:pointer;padding:2px 4px;font-family:inherit;flex:none}
.wide{
  width:100%; background:var(--card2); border:1px solid var(--line); color:var(--tx);
  padding:12px; border-radius:11px; font-size:13.5px; font-weight:700;
  cursor:pointer; font-family:inherit; margin-top:9px;
}
.backup-box{margin-top:12px;padding:10px;border:1px solid rgba(255,209,102,.28);border-radius:10px;background:rgba(255,209,102,.07);color:var(--dim);font-size:11px;line-height:1.45}.backup-box .wide{margin-top:7px}.backup-actions{display:flex;gap:7px}.backup-actions .wide{flex:1}.wide.danger{color:#ffaaa5;border-color:rgba(255,98,92,.3);background:rgba(255,98,92,.06)}
.wide.p{background:linear-gradient(135deg,var(--now),#8af0c5);color:#071a14;border-color:var(--now); box-shadow:0 7px 18px rgba(54,224,160,.18)}
.nearby-stop-picker{margin:0 0 11px;padding:10px 11px;border:1px solid rgba(54,224,160,.38);border-radius:12px;background:rgba(54,224,160,.07)}
.nearby-stop-picker .wide{margin-top:0}.nearby-stop-picker .hint{margin-top:7px}
.nearby-stop-result{margin-top:9px}.nearby-stop-result:not(:empty){padding:9px 10px;border-radius:9px;background:rgba(16,24,39,.38);color:var(--dim);font-size:12px;line-height:1.5}
.nearby-stop-result b{display:block;color:var(--tx);font-size:14px}.nearby-stop-result small{display:block;color:var(--faint);margin-top:2px}.nearby-stop-result .wide{margin-top:8px}
.li.nearby-stop{border-color:rgba(54,224,160,.72);box-shadow:0 0 0 2px rgba(54,224,160,.12)}
body.light .nearby-stop-picker{background:rgba(8,115,77,.06);border-color:rgba(8,115,77,.38)}body.light .nearby-stop-result:not(:empty){background:rgba(255,255,255,.68)}
.tag{
  display:inline-block; font-size:9.5px; font-weight:800; padding:2px 5px;
  border-radius:4px; letter-spacing:.4px; flex:none;
}
.tag.KMB{background:rgba(226,35,26,.16);color:#ff8079}
.tag.CTB{background:rgba(245,166,35,.16);color:#ffc165}
.tag.GMB{background:rgba(78,192,110,.16);color:#7fd897}

/* Moovey-first route detail reconstruction: compact summary + three-card live dock */
.route-detail{background:var(--bg-deep);overflow-anchor:none;}
.route-detail-head{background:var(--bg);border-bottom:1px solid var(--line);}
.route-detail-inner{max-width:720px;padding:0 12px 32px;}
.detail-summary{position:relative;padding:12px 14px 11px;border:0;border-radius:18px;background:var(--card);box-shadow:0 3px 16px rgba(0,0,0,.08);margin-bottom:8px;}
.detail-summary-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:7px;z-index:2;}
.detail-summary-tool{display:flex;align-items:center;justify-content:center;gap:3px;width:58px;height:48px;padding:4px 5px;border:1px solid rgba(108,140,255,.6);border-radius:13px;background:rgba(10,20,35,.3);color:#cbd7ff;font:800 11px/1 inherit;cursor:pointer;transition:background .18s ease,transform .18s ease,border-color .18s ease;}
.detail-summary-tool:hover{background:rgba(108,140,255,.2);border-color:#9eb2ff;}
.detail-summary-tool:active{transform:scale(.94);}
.detail-summary-tool.gps{color:#36e0a0;border-color:rgba(54,224,160,.7);}
.detail-summary-tool.gps{font-size:24px;}
.detail-summary-tool.gps img{display:block;width:25px;height:32px;object-fit:contain;}
.detail-summary-tool-label{display:block;white-space:nowrap;}
.detail-summary-tool.refresh{color:#b9c6ff;font-size:31px;line-height:.8;}
.detail-summary-tool:disabled{opacity:.55;cursor:wait;}
.detail-route-line{display:flex;align-items:center;gap:9px;min-width:0;font-size:18px;line-height:1.2;white-space:nowrap;}
.detail-route-line > span:last-child{overflow:hidden;text-overflow:ellipsis;}
.detail-route-line .tag{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding:7px 10px;border-radius:10px;font-size:16px;line-height:1;}
.detail-route-icon{font-size:15px;line-height:1;filter:saturate(1.15);}
.detail-meta{gap:4px 10px;margin-top:8px;padding-right:48px;font-size:11px;line-height:1.25;}
.detail-meta span{white-space:nowrap;}
.detail-reverse{position:absolute;right:12px;bottom:11px;width:34px;height:28px;margin:0;padding:0;border-radius:999px;font-size:0;line-height:1;}
.detail-reverse:before{content:'↔';font-size:16px;}
.detail-live-dock{position:static;top:auto;z-index:auto;margin:0 -4px 7px;padding:5px 4px 8px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;isolation:auto;}
.detail-live-dock .detail-current{padding:9px 12px;margin:0 0 6px;border-radius:12px;background:var(--card);border-color:var(--line);}
.detail-current-label{font-size:10px;}
.detail-current-name{font-size:15px;margin-top:3px;}
.detail-eta-panel{position:sticky;top:57px;z-index:3;gap:6px;margin:0;padding:5px 4px 8px;background:color-mix(in srgb,var(--bg-deep) 98%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 5px 14px rgba(0,0,0,.12);}
.detail-eta{min-height:78px;padding:8px 5px;border-radius:14px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.05);}
.detail-eta strong{font-size:20px;}
.detail-eta span{font-size:10px;margin-top:4px;}
.detail-eta small{font-size:9px;margin-top:3px;}
.detail-live-dock .detail-status{margin-top:6px;padding:7px 9px;font-size:10px;}
.detail-live-dock .detail-current,.detail-live-dock .detail-status,.detail-live-dock .detail-gps-panel{max-height:none;overflow:visible;opacity:1;visibility:visible;transform:none;transition:none;}
.detail-service{margin:16px 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;}
.detail-service summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;cursor:pointer;font-size:13px;font-weight:850;list-style:none;}
.detail-service summary::-webkit-details-marker{display:none}.detail-service summary:after{content:'＋';color:var(--faint);font-size:17px}.detail-service[open] summary:after{content:'－'}.detail-service-body{padding:0 13px 12px;border-top:1px solid var(--line)}
.detail-service-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.detail-service-item{padding:9px 10px;border-radius:10px;background:var(--card2);font-size:11px}.detail-service-item b{display:block;color:var(--tx);font-size:12px}.detail-service-item span{display:block;color:var(--faint);margin-top:3px;line-height:1.35}.detail-service-note{margin:9px 0 0;color:var(--faint);font-size:10.5px;line-height:1.45}.detail-service-note strong{color:var(--dim)}
.detail-timetable-head{margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--card2);font-size:11px;color:var(--dim)}.detail-timetable-head b{color:var(--now)}.detail-timetable{display:grid;gap:6px;margin-top:7px}.detail-timetable-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:var(--card2);font-size:11px}.detail-timetable-row.current{outline:1px solid var(--now);background:rgba(54,224,160,.1)}.detail-timetable-row b{color:var(--tx)}.detail-timetable-row span{font-size:15px;font-weight:900;color:var(--tx)}.detail-timetable-row small{color:var(--faint)}.detail-timetable-empty{padding:10px;color:var(--faint);font-size:11px;background:var(--card2);border-radius:10px;margin-top:7px}.detail-frequency-title{margin-top:10px;padding:8px 2px 4px;color:var(--tx);font-size:11px;font-weight:900}.detail-frequency-table{display:grid;gap:5px}.detail-frequency-row{display:grid;grid-template-columns:1.25fr auto 1fr;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;background:var(--card2);font-size:10px}.detail-frequency-row b{font-size:11px;color:var(--tx)}.detail-frequency-row small{color:var(--faint);text-align:right}.detail-schedule-check{margin-top:7px;padding:8px 9px;border-radius:8px;font-size:10px;background:rgba(164,174,186,.12);color:var(--dim)}.detail-schedule-check.ok{color:var(--now);background:rgba(54,224,160,.1)}.detail-schedule-check.warn{color:var(--soon);background:rgba(255,193,7,.1)}
.detail-service-link{display:inline-block;margin-top:9px;color:var(--now);font-size:11px;font-weight:800;text-decoration:none}.detail-service-link:hover{text-decoration:underline}.detail-official-update-link{display:inline-flex;align-items:center;gap:5px;margin:10px 7px 0 0;padding:8px 10px;border:1px solid rgba(54,224,160,.45);border-radius:8px;background:rgba(54,224,160,.1);color:var(--now);font-size:11px;font-weight:800;text-decoration:none}.detail-official-update-link:hover,.detail-official-update-link:focus-visible{text-decoration:underline;background:rgba(54,224,160,.18)}
.detail-between-bus{position:relative;height:26px;margin:0 0 0 0;z-index:2}.detail-between-bus .bus-front-marker{left:25px;top:50%;}.detail-between-bus .bus-status-label{position:absolute;left:43px;top:50%;transform:translateY(-50%);padding:4px 9px;border-radius:999px;background:rgba(54,224,160,.12);color:var(--now);font-size:10px;font-weight:800;white-space:nowrap}.detail-inference .bus-front-marker{width:18px;height:13px}.detail-between-bus .bus-front-marker{animation:busBounce 1.15s ease-in-out infinite;transform:translate(-50%,-50%)}
 .detail-inference.virtual{position:relative;display:flex;align-items:center;gap:8px;margin:2px 5px 4px 0;padding:5px 0 5px 68px;min-height:44px;border:0;background:transparent;color:var(--tx);box-shadow:none}
 .virtual-bus-card{position:absolute;left:0;top:50%;transform:translateY(-50%);flex:0 0 56px;width:56px;height:40px;display:grid;place-items:end center;border:0;border-radius:8px;background:transparent;overflow:visible}
 .virtual-route-label{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;padding:2px 5px;border:1px solid rgba(255,111,154,.75);border-radius:5px;background:#3a2946;color:#ffd2df;font:900 10px/1 inherit;letter-spacing:.2px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
 .detail-inference.virtual .bus-front-marker{position:relative;left:auto;top:auto;transform:none;flex:0 0 30px;width:30px;height:21px;border-radius:5px;animation:virtualBusBounce 1.1s ease-in-out infinite}
.detail-inference.virtual .bus-front-marker:before{left:4px;right:4px;top:4px;height:6px;box-shadow:0 8px 0 -1px var(--bg-deep)}
.detail-inference.virtual .bus-front-marker:after{bottom:-4px}
 .virtual-bus-copy{align-self:center;display:flex;flex:1;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-width:0;padding:0;border:0;border-radius:0;background:transparent;text-align:left}.virtual-bus-copy b{font-size:11px;line-height:1.15;color:var(--now);text-align:left}.virtual-bus-copy small{margin:0;color:var(--faint);font-size:10px;line-height:1.2;text-align:left}
.stop-copy small{display:none;}
.detail-inference.virtual .bus-front-marker{width:30px!important;height:21px!important;flex-basis:30px!important;border-radius:5px!important;box-shadow:0 0 0 3px rgba(128,148,255,.18)!important;}
.detail-inference.virtual .bus-front-marker:before{left:4px!important;right:4px!important;top:4px!important;height:6px!important;box-shadow:0 9px 0 -1px var(--bg-deep)!important}
.detail-inference.virtual .bus-front-marker:after{bottom:-4px!important;}
.detail-inference.virtual .virtual-route-label{display:block}
.near-arrival-dot{display:inline-block;width:8px;height:8px;margin-right:2px;border-radius:50%;background:#00e58a;box-shadow:0 0 0 3px rgba(0,229,138,.18),0 0 12px rgba(0,229,138,.72);animation:nearArrivalFlash .85s ease-in-out infinite;vertical-align:middle}.detail-eta:first-child .near-arrival-dot{margin-bottom:2px}.detail-eta.near-arrival{border-color:rgba(0,229,138,.62);box-shadow:0 0 0 2px rgba(0,229,138,.08),0 0 18px rgba(0,229,138,.14)}
@keyframes nearArrivalFlash{0%,100%{opacity:.35;transform:scale(.78)}50%{opacity:1;transform:scale(1.18)}}
@keyframes busBounce{0%,100%{translate:0 0}50%{translate:0 -5px}}@keyframes virtualBusBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.detail-section-title{margin:13px 3px 6px;font-size:13px;}
.stop-timeline{padding-top:0;background:var(--card);border-radius:16px;padding:5px 7px 12px;box-shadow:0 3px 14px rgba(0,0,0,.06);}
.stop-timeline:before{left:28px;top:24px;bottom:25px;}
.stop-row{min-height:92px;padding:15px 5px 15px 0;gap:10px;border-radius:10px;}
.stop-copy strong{line-height:1.2;}
.stop-copy small{margin-top:3px;line-height:1.2;}
.stop-dot{flex-basis:42px;}
.stop-dot:after{width:14px;height:14px;background:var(--card);}
.stop-dot .bus-front-marker{display:none;}
.stop-row.is-selected .stop-dot:after{width:18px;height:18px;}
.stop-copy strong{font-size:14px;}
.stop-copy strong .station-code{color:#8f98a3;font-size:.72em;font-weight:600;letter-spacing:0;}
.stop-copy small{font-size:10px;margin-top:3px;}
.stop-state{font-size:10px;}
.detail-inference{margin-left:42px;margin-right:5px;border-radius:9px;padding:7px 9px;font-size:10px;}
@media(max-width:380px){.detail-route-line{font-size:16px}.detail-route-line .tag{font-size:14px;padding:6px 8px}.detail-meta{font-size:10px}.detail-eta strong{font-size:18px}.detail-eta{min-height:74px}}
@media(prefers-reduced-motion:reduce){.near-arrival-dot,.detail-between-bus .bus-front-marker,.detail-inference .bus-front-marker{animation:none!important}}

<script>
'use strict';
/* ===================================================================
   巴士到站牌 — 三間公司 API adapter
   KMB : data.etabus.gov.hk/v1
   CTB : rt.data.gov.hk/v2/transport/citybus   (新巴已併入 CTB)
   GMB : data.etagmb.gov.hk                   (綠色專線小巴)
   =================================================================== */
const KMB = 'https://data.etabus.gov.hk/v1/transport/kmb';
const CTB = 'https://rt.data.gov.hk/v2/transport/citybus';
const GMB = 'https://data.etagmb.gov.hk';

const CO_NAME = { KMB:'九巴', CTB:'城巴', GMB:'小巴' };
const REGION  = { HKI:'港島', KLN:'九龍', NT:'新界' };

/* ---- fetch with timeout + JSON ---- */
async function getJSON(url, ms = 12000) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ---- in-memory cache for static data (routes / stop names) ---- */
const memo = new Map();
function cached(key, fn) {
  if (!memo.has(key)) memo.set(key, fn().catch(e => { memo.delete(key); throw e; }));
  return memo.get(key);
}

/* =========================  ROUTE SEARCH  ========================= */
/* Returns array of variant objects, normalised across companies:
   { co, route, dirLabel, origin, dest, ...co-specific keys }        */

async function searchKMB(route) {
  const all = (await cached('kmb:routes', () => getJSON(KMB + '/route/'))).data;
  const R = route.toUpperCase();
  return all.filter(r => r.route.toUpperCase().startsWith(R)).map(r => ({
    co: 'KMB', route: r.route,
    bound: r.bound === 'O' ? 'outbound' : 'inbound',
    dir: r.bound, service_type: r.service_type,
    origin: r.orig_tc, dest: r.dest_tc,
    dirLabel: r.orig_tc + ' → ' + r.dest_tc,
    extra: r.service_type !== '1' ? '特別班次 ' + r.service_type : ''
  }));
}

async function searchCTBExact(route) {
  const R = route.toUpperCase();
  let info;
  try { info = (await getJSON(CTB + '/route/CTB/' + encodeURIComponent(R))).data; }
  catch { return []; }
  if (!info || !info.route) return [];
  const out = [];
  for (const b of ['inbound', 'outbound']) {
    let stops = [];
    try { stops = (await getJSON(CTB + '/route-stop/CTB/' + encodeURIComponent(R) + '/' + b)).data || []; }
    catch { continue; }
    if (!stops.length) continue;
    const fwd = b === 'outbound';
    out.push({
      co: 'CTB', route: info.route, bound: b, dir: fwd ? 'O' : 'I',
      origin: fwd ? info.orig_tc : info.dest_tc,
      dest:   fwd ? info.dest_tc : info.orig_tc,
      dirLabel: (fwd ? info.orig_tc : info.dest_tc) + ' → ' + (fwd ? info.dest_tc : info.orig_tc),
      extra: ''
    });
  }
  return out;
}

async function searchCTB(route) {

function renderDiagnostics() {
  const el = document.querySelector('#diagBox');

    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const planCount = Object.values(alarmPlans).reduce((n, l) => n + (Array.isArray(l) ? l.length : 0), 0);
  const rows = [
    ['系統通知權限', perm === 'granted' ? '✓ 已允許' : perm === 'denied' ? '✗ 已封鎖' : '⚠ 未決定（請撳上面允許）'],

    ['上次成功更新', lastOK ? Math.round((Date.now() - lastOK) / 1000) + ' 秒前' : '未更新']
  ];
  let html = rows.map(([k, v]) => '<div class="diag-row"><span>' + k + '</span><b>' + esc(v) + '</b></div>').join('');
  if (ios && !standalone) {
    html += '<div class="diag-warn">⚠ iPhone／iPad 必須先用 Safari「分享 → 加入主畫面」，再由主畫面圖示開啟，通知才會運作。</div>';
  }

  }
  const plans = [];
  Object.entries(alarmPlans).forEach(([id, list]) => {
    (Array.isArray(list) ? list : []).forEach(p => plans.push(p));
  });
  plans.sort((a, b) => Number(a.at) - Number(b.at));
  const lines = plans.slice(0, 6).map(p => {
    const t = new Date(Number(p.at)).toLocaleTimeString('en-GB', { hour12:false });

async function roadPath(stops) {
  const valid = stops.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
  if (valid.length < 2) return valid.map(x => [x.lat, x.lng]);
  const gapKm = (a,b) => Math.hypot((b.lat-a.lat)*111, (b.lng-a.lng)*102);
  // Long gaps often make a multi-waypoint router choose an unrelated road/ferry.
  // Route these links separately so mountain roads, tunnels and bridges stay in order.
  if (valid.some((x,i) => i && gapKm(valid[i-1],x) > 5)) {
    const segmented = [];
    for (let i=1; i<valid.length; i++) {
      const a=valid[i-1], b=valid[i];
      try {
        const q=await getJSON('https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=full&geometries=geojson&steps=false', 12000);
        const line=q.routes?.[0]?.geometry?.coordinates || [];
        if (line.length > 1) {
          const lats=line.map(x=>x[1]), lngs=line.map(x=>x[0]);
          const outside=line.some(x => Math.abs(x[1]-((a.lat+b.lat)/2)) > .18 || Math.abs(x[0]-((a.lng+b.lng)/2)) > .25);
          const directKm=gapKm(a,b), routeKm=Number(q.routes?.[0]?.distance || 0)/1000;
          // OSRM may choose a ferry/跨境 detour between nearby airport stops.
          // Reject implausible segments before drawing them.
          if (!outside && routeKm > 0 && routeKm <= Math.max(25, directKm * 6)) {
            if (i > 1) line.shift(); segmented.push(...line.map(x => [x[1],x[0]])); continue;
          }
        }
      } catch {}
      if (i > 1) segmented.pop();
      segmented.push([a.lat,a.lng],[b.lat,b.lng]);
    }
    if (segmented.length > 1) return segmented;
  }
  try {
    const coords = valid.map(x => x.lng + ',' + x.lat).join(';');
    const d = await getJSON('https://router.project-osrm.org/route/v1/driving/' + coords + '?overview=full&geometries=geojson&steps=false', 15000);
    const line = d.routes?.[0]?.geometry?.coordinates || [];
    if (line.length > 1) {
      const lats = valid.map(x => x.lat), lngs = valid.map(x => x.lng);
      const minLat = Math.min(...lats) - .03, maxLat = Math.max(...lats) + .03;
      const minLng = Math.min(...lngs) - .03, maxLng = Math.max(...lngs) + .03;
      const outside = line.some(x => x[1] < minLat || x[1] > maxLat || x[0] < minLng || x[0] > maxLng);
      const directKm = valid.slice(1).reduce((sum, x, i) => {
        const a = valid[i], dy = (x.lat-a.lat)*111, dx = (x.lng-a.lng)*102;
        return sum + Math.hypot(dx, dy);
      }, 0);
      const routeKm = Number(d.routes?.[0]?.distance || 0) / 1000;
      // Reject implausible detours (e.g. E41 being routed towards Zhuhai/Macau).
      if (!outside && (!routeKm || routeKm <= Math.max(80, directKm * 3.2))) return line.map(x => [x[1], x[0]]);
    }
  } catch {}
  return valid.map(x => [x.lat, x.lng]);
}

function stopDistanceMeters(stop, lat, lng) {
  const earthRadius = 6371000;
  const φ1 = Number(lat) * Math.PI / 180, φ2 = Number(stop.lat) * Math.PI / 180;
  const Δφ = (Number(stop.lat) - Number(lat)) * Math.PI / 180;
  const Δλ = (Number(stop.lng) - Number(lng)) * Math.PI / 180;
  const a = Math.sin(Δφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
  return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function nearestStopMatch(stops, lat, lng) {
  return stops.filter(st => Number.isFinite(Number(st.lat)) && Number.isFinite(Number(st.lng))).reduce((best, st) => {
    const distance = stopDistanceMeters(st, lat, lng);
    return !best || distance < best.distance ? { st, distance } : best;
  }, null);
}

function nearestStop(stops, lat, lng) {
  return nearestStopMatch(stops, lat, lng)?.st;
}

function locationErrorText(error) {

  if (error?.code === 3) return '定位逾時，請再試一次。';
  return '暫時未能定位，請手動揀站頭。';
}

function findNearestSetupStop(v, stops, button, output) {

      '<button class="wide p" type="button" id="confirmNearbyStop">使用呢個站</button>';
    const candidate = match.st;

function locateOnMap(map, stops, button) {
  if (!navigator.geolocation) { button.textContent = '此瀏覽器不支援定位'; return; }
  button.textContent = '⌖ 定位中…';
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (window.__userMarker) window.__userMarker.remove();
    window.__userMarker = L.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#ff625c', fillOpacity: .95 }).addTo(map).bindPopup('<b>你目前位置</b>').openPopup();
    map.setView([lat, lng], 17);
    const near = nearestStop(stops, lat, lng);
    if (near) map.eachLayer(layer => { if (layer.getLatLng && Math.abs(layer.getLatLng().lat-near.lat)<1e-8 && Math.abs(layer.getLatLng().lng-near.lng)<1e-8) layer.openPopup(); });
    button.textContent = '⌖ 已定位到附近';
  }, () => { button.textContent = '⌖ 定位失敗，請允許 GPS'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
}

function toggleLiveRouteGPS(it, map, stops, button) {
  const id = uid(it);
  const current = liveMapStates.get(id);
  if (current?.watch != null) {
    navigator.geolocation.clearWatch(current.watch); current.watch = null; liveMapStates.set(id, current);
    button.textContent = '⌖ 開啟 GPS';
    const note = document.querySelector('[data-live-note="' + cssEscape(id) + '"]'); if (note) note.textContent = 'GPS 已停止；需要時可以再次撳「開啟 GPS」。';
    return;
  }
  if (!navigator.geolocation) { button.textContent = '此手機不支援 GPS'; return; }
  button.textContent = '⌖ 定位中…';
  const state = current || { marker:null, centered:false, watch:null };
  const valid = stops.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lng));
  state.watch = navigator.geolocation.watchPosition(pos => {
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    if (!state.marker) state.marker=L.circleMarker([lat,lng], { radius:8, color:'#fff', weight:3, fillColor:'#ff625c', fillOpacity:.95 }).addTo(map);
    else state.marker.setLatLng([lat,lng]);
    // 導航式跟隨：每次 GPS 更新都保持用家位置在畫面內，唔會只定位一次。
    map.setView([lat,lng], Math.max(map.getZoom(), 15), { animate:false });
    state.centered=true;
    const near=nearestStop(valid,lat,lng);
    const idx=near ? valid.findIndex(x => x.seq === near.seq) : -1;
    const next=idx >= 0 ? valid[idx+1] : null;
    const note=document.querySelector('[data-live-note="' + cssEscape(id) + '"]');
    if (note) note.textContent = near ? ('你目前接近：第 ' + near.seq + ' 站「' + near.name + '」' + (next ? '｜下一站：第 ' + next.seq + ' 站「' + next.name + '」' : '｜已接近尾站') + '｜地圖跟住你') : 'GPS 已開啟，地圖會跟住你移動…';
    button.textContent='⌖ GPS 跟住我';
  }, () => { button.textContent='⌖ GPS 失敗，請允許定位'; }, { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
  liveMapStates.set(id,state);
}

function paint(it, res) {
  const slot = board.querySelector('[data-slot="' + cssEscape(uid(it)) + '"]');
  if (!slot) return;
  const card = slot.closest('.card');

                     '<div class="u">' + esc(res.err) + '</div></div>';
    return;
  }
  if (!res.etas.length) {
    slot.innerHTML = '';
    card.insertAdjacentHTML('beforeend', '<div class="none">暫時冇班次資料（可能已收車）</div>');
    return;
  }
  const etaItems = res.etas.slice(0, 3).concat(Array(Math.max(0, 3 - res.etas.length)).fill(null));
  slot.innerHTML = etaItems.map((e, i) => {
    if (!e) return '<div class="eta eta-empty" aria-hidden="true"></div>';
    const liveMin = e.iso && Number.isFinite(Date.parse(e.iso)) ? Math.round((Date.parse(e.iso) - Date.now()) / 60000) : e.min;
    const hhmm = new Date(e.iso).toLocaleTimeString('en-GB',
      { hour:'2-digit', minute:'2-digit', hour12:false });
    const cls = ['eta', liveMin <= 2 ? 'eta-near' : liveMin <= 10 ? 'eta-soon' : 'eta-later'];
    if (e.sched) cls.push('sch');
    let big;
    if (liveMin <= 0) { cls.push('arr'); big = '<div class="eta-main"><div class="m">即將到達</div></div>'; }
    else            { big = '<div class="eta-main"><div class="m">' + liveMin + '</div><div class="u">分鐘</div></div>'; }
    return '<div class="' + cls.join(' ') + '">' + big +
           '<div class="t">' + hhmm + '</div></div>';
  }).join('');

  const rmks = res.stale ? ['網絡暫時中斷，以下按上次估算倒數'] : [];
  if (rmks.length) {
    card.insertAdjacentHTML('beforeend',
      '<div class="rmk">' + rmks.map(r => '<span>&#9432; ' + esc(r) + '</span>').join('') + '</div>');
  }
}

async function refresh(options = {}) {
  const manual = options.manual === true;
  if (inFlight || !items.length) {
    if (manual && !items.length && refreshBtn) {
      refreshBtn.classList.add('no-data');
      refreshBtn.title = '請先設定路線';
      setTimeout(() => { refreshBtn.classList.remove('no-data'); refreshBtn.title = '即刻更新'; }, 900);
    }
    return;
  }
  if (manual && refreshBtn) {
    refreshBtn.disabled = true;
    refreshBtn.classList.add('loading');
    refreshBtn.title = '更新中…';
  }
  inFlight = true;
  try {
    dot.className = 'dot';
    const snapshot = items.slice();
    const results = await Promise.all(snapshot.map(fetchETA));
    snapshot.forEach((it, i) => {
      if (items.some(x => uid(x) === uid(it))) {
        const id = uid(it), fresh = results[i];
        if (!fresh.err && fresh.etas.length) cacheEta(id, fresh.etas);
        const fallback = fresh.err || !fresh.etas.length ? cachedEta(id) : null;
        const display = fallback || fresh;
        latestResults.set(id, display);
        paint(it, display);
        scheduleAlarmFallbacks(it, display, { stale: !!display.stale });
        checkAlarms(it, display);
      }
    });
    renderPip();
    const anyOK = results.some(r => !r.err);
    if (anyOK) lastOK = Date.now();
    dot.className = 'dot' + (anyOK ? '' : ' err');
  } catch (e) {
    // Keep the 25-second loop alive if an unexpected rendering/notification
    // error escapes one of the per-route handlers.
    dot.className = 'dot err';
    console.warn('BusPulse refresh failed', e);
  } finally {
    inFlight = false;
    updateInfoBar();
    if (manual && refreshBtn) {
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('loading');
      refreshBtn.title = dot.classList.contains('err') ? '更新失敗，請稍後再試' : '更新完成';
      setTimeout(() => { if (refreshBtn) refreshBtn.title = '即刻更新'; }, 1600);
    }
  }
}

/*
   Keep polling as a self-correcting timeout rather than a chained interval.
   Browsers still throttle/suspend hidden pages, but this avoids accumulating
   drift after a throttled callback and makes the first refresh after resume
   immediate. The alarm fallback timers remain active between polls.
*/
let timer = null;
let nextRefreshAt = 0;
let loopRunning = false;
function startLoop() {
  stopLoop();
  loopRunning = true;
  refresh();
  const schedule = () => {
    if (!loopRunning) return;
    const now = Date.now();
    nextRefreshAt = Math.max(nextRefreshAt + 25000, now + 25000);
    timer = setTimeout(async () => {
      timer = null;
      await refresh();
      schedule();
    }, Math.max(1000, nextRefreshAt - now));
  };
  nextRefreshAt = Date.now();
  schedule();
}
function stopLoop() { loopRunning = false; if (timer) { clearTimeout(timer); timer = null; } }

async function geocodeHK(q) {

    '粉嶺':[22.492,114.139],'上水':[22.502,114.127],'馬鞍山':[22.425,114.23],'將軍澳':[22.307,114.258],
    '葵涌':[22.356,114.129],'青衣':[22.35,114.108],'九龍塘':[22.337,114.176],'中環':[22.281,114.158],
    '銅鑼灣':[22.28,114.185],'北角':[22.29,114.2],'鰂魚涌':[22.288,114.213],'鰂魚涌站':[22.288,114.213],'太古城':[22.288,114.216],'太古城中心':[22.288,114.216],'香港仔':[22.248,114.155],
    'tai po':[22.45,114.16],'sha tin':[22.38,114.19],'mong kok':[22.319,114.169],'tsim sha tsui':[22.296,114.172],
    'tsuen wan':[22.371,114.113],'tai wo hau':[22.370365,114.124962],'quarry bay':[22.288,114.213],'taikoo shing':[22.288,114.216],'kwun tong':[22.312,114.225]
  };
  const key = q.trim().toLowerCase();
  const local = Object.keys(aliases).find(k => key === k || key.includes(k));
  if (local) return {lat:aliases[local][0],lng:aliases[local][1],label:q};
  const d = await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=hk&q=' + encodeURIComponent(q + ', Hong Kong'), 12000);

function distanceKm(a,b) { return Math.hypot((a.lat-b.lat)*111, (a.lng-b.lng)*102); }
function routeResultsAtCoordinates(from, to, idx) {
  const results=[];
  for (const r of idx) {
    let start=null, end=null;
    for (const st of r.stops) {
      if (!Number.isFinite(st.lat) || !Number.isFinite(st.lng)) continue;
      const d1=distanceKm(from,st), d2=distanceKm(to,st);
      if (!start || d1 < start.d) start={...st,d:d1};
      if (!end || d2 < end.d) end={...st,d:d2};
    }
    if (!start || !end || start.d > 5 || end.d > 5) continue;
    // Prefer routes whose nearest stops follow the actual direction.
    if (start.seq >= end.seq) continue;
    const score=start.d+end.d;
    results.push({ co:'KMB', route:r.route, bound:r.bound==='O'?'outbound':'inbound', dir:r.bound,
      service_type:r.service_type, origin:r.orig_tc, dest:r.dest_tc,
      dirLabel:r.orig_tc+' → '+r.dest_tc, extra:'起點約 '+start.d.toFixed(1)+' km · 終點約 '+end.d.toFixed(1)+' km',
      placeStart:start, placeEnd:end, placeScore:score,
      officialOneWay:idx.filter(x => x.route===r.route && String(x.service_type)===String(r.service_type)).length < 2 });
  }
  results.sort((a,b)=>a.placeScore-b.placeScore);
  return {from,to,results:results.slice(0,60)};
}
function journeyRouteKey(r){ return r ? String(r.route||'')+'|'+String(r.bound||'')+'|'+String(r.service_type||'') : ''; }
function nearestRouteStop(r, point, mode='any') {
  let best=null;
  for(const st of r.stops||[]){ if(!Number.isFinite(st.lat)||!Number.isFinite(st.lng)) continue; const d=distanceKm(point,st); if(!best||d<best.d) best={...st,d}; }
  return best;
}
function buildTransferResults(from,to,idx,directResults) {
  const byKey=new Map(), origins=[], destinations=[];
  for(const r of idx){
    const key=journeyRouteKey(r); if(byKey.has(key)) continue; byKey.set(key,r);
    const start=nearestRouteStop(r,from), end=nearestRouteStop(r,to);
    if(start?.d<=5) origins.push({r,start}); if(end?.d<=5) destinations.push({r,end});
  }
  const grid=new Map(), cell=.008;
  const gridKey=(lat,lng)=>Math.floor(lat/cell)+','+Math.floor(lng/cell);
  for(const item of destinations) for(const st of item.r.stops||[]){
    if(!Number.isFinite(st.lat)||!Number.isFinite(st.lng)) continue;
    const k=gridKey(st.lat,st.lng); if(!grid.has(k)) grid.set(k,[]); grid.get(k).push({...item,transfer:st});
  }
  const out=[], seen=new Set();
  for(const first of origins){
    for(const a of first.r.stops||[]){
      if(a.seq<=first.start.seq||!Number.isFinite(a.lat)||!Number.isFinite(a.lng)) continue;
      const baseLat=Math.floor(a.lat/cell), baseLng=Math.floor(a.lng/cell);
      for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++) for(const second of grid.get((baseLat+di)+','+(baseLng+dj))||[]){
        if(second.r.route===first.r.route || second.transfer.seq>=second.end.seq) continue;
        const walk=distanceKm(a,second.transfer); if(walk>.8) continue;
        const key=first.r.route+'>'+second.r.route+'|'+first.start.id+'|'+second.transfer.id+'|'+second.end.id; if(seen.has(key)) continue; seen.add(key);
        out.push({kind:'transfer',route:first.r.route+' → '+second.r.route,transfers:1,routeSegments:[first.r,second.r],origin:first.r.orig_tc,dest:second.r.dest_tc,dirLabel:first.r.orig_tc+' → '+second.r.dest_tc,placeStart:first.start,placeEnd:second.end,transfer:{from:a,to:second.transfer,d:walk},placeScore:first.start.d+walk+second.end.d,extra:'上車距離 '+first.start.d.toFixed(1)+' km · 轉車步行 '+walk.toFixed(1)+' km · 落車距離 '+second.end.d.toFixed(1)+' km'});
      }
    }
  }
  out.sort((a,b)=>a.placeScore-b.placeScore); return out.slice(0,40);
}
function buildTwoTransferResults(from,to,idx) {
  const destinations=[], origins=[], routeMap=new Map(), grid=new Map(), cell=.008;
  const gk=(lat,lng)=>Math.floor(lat/cell)+','+Math.floor(lng/cell);
  for(const r of idx){ const key=journeyRouteKey(r); if(routeMap.has(key)) continue; routeMap.set(key,r); const start=nearestRouteStop(r,from), end=nearestRouteStop(r,to); if(start?.d<=5) origins.push({r,start}); if(end?.d<=5) destinations.push({r,end}); for(const st of r.stops||[]){if(!Number.isFinite(st.lat)||!Number.isFinite(st.lng))continue;const k=gk(st.lat,st.lng);if(!grid.has(k))grid.set(k,[]);grid.get(k).push({r,st});} }
  const destByKey=new Map(destinations.map(x=>[journeyRouteKey(x.r),x])), out=[], seen=new Set();
  const nearby=(st)=>{const a=Math.floor(st.lat/cell),b=Math.floor(st.lng/cell),v=[];for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)v.push(...(grid.get((a+i)+','+(b+j))||[]));return v;};
  for(const first of origins){ if(!first?.r?.route)continue; for(const a of first.r.stops||[]){ if(a.seq<=first.start.seq)continue; for(const e1 of nearby(a)){ if(!e1?.r?.route||!e1?.st||e1.r.route===first.r.route)continue; const middle=e1.r; for(const b of middle.stops||[]){if(b.seq<=e1.st.seq)continue; for(const e2 of nearby(b)){if(!e2?.r?.route||!e2?.st)continue;const last=destByKey.get(journeyRouteKey(e2.r)); if(!last?.r?.route||!last.end||last.r.route===first.r.route||last.r.route===middle.route||e2.st.seq>=last.end.seq)continue; const d1=distanceKm(a,e1.st),d2=distanceKm(b,e2.st);if(d1>.8||d2>.8)continue;const key=first.r.route+'>'+middle.route+'>'+last.r.route+'|'+first.start.id+'|'+e1.st.id+'|'+e2.st.id; if(seen.has(key))continue;seen.add(key);out.push({kind:'transfer',route:first.r.route+' → '+middle.route+' → '+last.r.route,transfers:2,origin:first.r.orig_tc,dest:last.r.dest_tc,dirLabel:first.r.orig_tc+' → '+last.r.dest_tc,placeStart:first.start,placeEnd:last.end,transfer:{from:a,to:e1.st,d:d1},transfer2:{from:b,to:e2.st,d:d2},placeScore:first.start.d+d1+d2+last.end.d,extra:'上車 '+first.start.d.toFixed(1)+' km · 兩次轉車步行 '+(d1+d2).toFixed(1)+' km · 落車 '+last.end.d.toFixed(1)+' km'}); if(out.length>=40)return out;} } } } }
  out.sort((a,b)=>a.placeScore-b.placeScore); return out.slice(0,40);
}
async function searchJourneyOptions(from,to,idx) {
  const direct=routeResultsAtCoordinates(from,to,idx); const one=buildTransferResults(from,to,idx,direct.results), two=buildTwoTransferResults(from,to,idx);

async function searchPlaceRoutes(fromQ, toQ) {

}

        '</button>').join('') +
    '</div>' +
    '<button class="wide p" id="addBtn">⌖ 由起點／終點搵路線</button>' +
    '<div class="lbl">路線號碼</div>' +
    '<input class="tin" id="rIn" placeholder="例如 1A、89、往 108…" autocomplete="off" ' +
      'autocapitalize="characters" enterkeyhint="search">' +
    '<div class="hint" id="rHint">輸入號碼然後揿「搵路線」。小巴只有綠色專線小巴有實時數據。</div>' +
    '<button class="wide p" id="goBtn">搵路線</button>' +
    '<div id="rOut"></div>' +
    '<button class="wide" id="backBtn">← 返回</button>';
  sBody.scrollTop = 0;

  sBody.querySelectorAll('.seg').forEach(b => b.addEventListener('click', () => {
    pickCo = b.dataset.co;
    sBody.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === b));
    $('#rOut').innerHTML = '';
  }));
  $('#backBtn').addEventListener('click', viewHome);
  $('#addBtn').addEventListener('click', viewPlaceSearch);
  const inp = $('#rIn');
  $('#goBtn').addEventListener('click', () => doSearch(inp.value.trim()));
  let searchTimer;
  inp.addEventListener('input', () => { clearTimeout(searchTimer); const q = inp.value.trim(); if (!q) { $('#rOut').innerHTML = ''; return; } searchTimer = setTimeout(() => doSearch(q), 380); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(inp.value.trim()); } });
  setTimeout(() => inp.focus(), 260);
}

async function doSearch(q) {
  const out = $('#rOut');
  if (!q) { out.innerHTML = '<div class="msg">請輸入路線號碼</div>'; return; }
  out.innerHTML = '<div class="msg"><span class="spin"></span>搵緊 ' + esc(q) + ' …</div>';
  let vs = [];
  try { vs = await searchRoute(pickCo, q); }
  catch { out.innerHTML = '<div class="msg">讀取失敗，請檢查網絡再試</div>'; return; }
  vs.sort((a, b) => (a.dirLabel || '').localeCompare(b.dirLabel || '', 'zh-HK'));
  if (!vs.length) {
    out.innerHTML = '<div class="msg">搵唔到 <b>' + esc(q.toUpperCase()) + '</b><br>' +
      '睇下係唔係揀錯公司，或者號碼有冇打錯</div>';
    return;
  }
  window.__vs = vs;
  const groups=[]; const byKey=new Map();
  vs.forEach((v,i) => { const key=v.route+'|'+(v.service_type || '')+'|'+(v.region || ''); let g=byKey.get(key); if(!g){g={route:v.route,items:[]};byKey.set(key,g);groups.push(g);} g.items.push({...v,__index:i}); });
  out.innerHTML = '<div class="lbl">揀方向（' + vs.length + ' 個可用方向）</div>' + groups.map(g => {
    const oneWay=g.items.length===1 && g.items[0].co !== 'GMB';
    const rows=g.items.map(v => '<button class="li" data-v="'+v.__index+'"><span class="n">'+esc(v.route)+'</span><span class="d">'+esc(v.dirLabel)+(v.extra?'<s>'+esc(v.extra)+'</s>':'')+(oneWay?'<small class="reverse-missing">巴士公司未有提供相反方向路線資料</small>':'')+'</span><span class="a">›</span></button>');
    return '<div class="place-route-group"><div class="lbl"><b>'+esc(g.route)+'</b> <small>'+ (oneWay?'單一方向':'兩個方向') +'</small></div><div class="list">'+rows.join('')+'</div></div>';
  }).join('');
  out.querySelectorAll('[data-v]').forEach(b =>
    b.addEventListener('click', () => viewStops(window.__vs[+b.dataset.v])));
}

/* ---------- view 3: pick stop ---------- */
function editBoardStop(it) {
  openSheet();
  viewStops({...it, editId:uid(it), dirLabel:'目前路線：往 ' + (it.dest || '')});
}
async function viewStops(v) {
  sTitle.textContent = v.route + (v.editId ? ' — 更改上車站' : ' — 揀站頭');
  sBody.innerHTML = '<div class="msg"><span class="spin"></span>載入站頭 …</div>';
  sBody.scrollTop = 0;
  let stops;
  try { stops = await getRouteStopsCached(v); }
  catch {
    sBody.innerHTML = '<div class="msg">站頭讀取失敗</div>' +
      '<button class="wide" id="bk">← 返回</button>';
    $('#bk').addEventListener('click', viewSearch);
    return;
  }
  setupMapInstance = null;
  sBody.innerHTML =
    '<div class="lbl">' + esc(v.dirLabel) + '</div>' +
    '<div class="nearby-stop-picker"><button class="wide p" type="button" id="nearbyStopBtn">⌖ 我喺車站：自動找最近站</button><div class="hint">只會喺你撳掣後要求手機定位；程式會由呢條路線嘅站頭中找最近一個，再畀你確認。</div><div class="nearby-stop-result" id="nearbyStopResult" aria-live="polite"></div></div>' +
    '<div class="map-actions" style="padding:0 0 10px"><button class="map-toggle" id="setupMapBtn"><span>🗺 先睇全條路線地圖</span><span class="map-arrow">⌄</span></button></div>' +
    '<div class="map-wrap" id="setupMapWrap"><div class="map-tools"><button class="locate-btn" id="locateBtn">⌖ 定位我附近</button></div><div class="route-map"></div></div>' +
    '<div class="hint" style="margin:0 0 10px">' + (v.editId ? '揀新上車站，會直接更新原有路線卡，不會新增路線。' : '唔知站名可以先撳上面「自動找最近站」，或者喺下面手動揀你上車嗰個站。') + '（' + stops.length + ' 個）</div>' +
    '<div class="list">' + stops.map((s, i) =>
      '<button class="li sm" data-s="' + i + '">' +
        '<span class="n">' + s.seq + '</span>' +
        '<span class="d">' + esc(s.name) + '</span>' +
        '<span class="a">＋</span>' +
      '</button>').join('') + '</div>' +
    '<button class="wide" id="bk">← 返回</button>';
  $('#nearbyStopBtn').addEventListener('click', () => findNearestSetupStop(v, stops, $('#nearbyStopBtn'), $('#nearbyStopResult')));
  $('#setupMapBtn').addEventListener('click', () => showSetupMap(v, stops, $('#setupMapBtn')));
  $('#bk').addEventListener('click', v.editId ? viewHome : viewSearch);
  sBody.querySelectorAll('[data-s]').forEach(b =>
    b.addEventListener('click', () => addItem(v, stops[+b.dataset.s])));
}

function addItem(v, s) {
  if (v.editId) {
    const index = items.findIndex(x => uid(x) === v.editId);
    if (index < 0) { viewHome(); return; }
    const oldId = uid(items[index]);
    const next = {...items[index], seq:s.seq, stopId:s.id, stopName:s.name};
    const newId = uid(next);
    if (oldId !== newId) {
      const enabled = alarms[oldId] === true;
      deactivateAlarm(oldId); delete alarms[oldId];
      alarms[newId] = enabled;
      if (enabled) alarmSessions[newId] = newAlarmSession();
      saveAlarmSessions();
      if (getoff[oldId] != null) { getoff[newId] = getoff[oldId]; delete getoff[oldId]; }
    }
    items[index] = next; save(); saveAlarms(); saveGetoff(); shell(); refresh(); viewHome(); return;
  }
  const it = v.co === 'GMB'
    ? { co:'GMB', route:v.route, region:v.region, route_id:v.route_id,
        route_seq:v.route_seq, seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest }
    : v.co === 'KMB'
    ? { co:'KMB', route:v.route, bound:v.bound, dir:v.dir, service_type:v.service_type,
        seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest }
    : { co:'CTB', route:v.route, bound:v.bound, dir:v.dir,
        seq:s.seq, stopId:s.id, stopName:s.name, dest:v.dest };
  if (items.some(x => uid(x) === uid(it))) { viewHome(); return; }
  // 新增路線預設關閉到站鬧鐘。只有使用者主動撳該路線的 🔔，
  // 先可以加入本機提醒；單純允許系統通知唔等於
  // 同意所有新路線自動響鬧鐘。
  items.push(it);
  alarms[uid(it)] = false;
  save(); saveAlarms(); shell(); refresh(); viewHome();
}

/* ===================================================================
   PWA INSTALL
   =================================================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
async function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {}));
}

function syncAlarmStateFromStorage() {
  const nextAlarms = loadAlarms(), nextSessions = loadAlarmSessions();
  const savedIds = new Set(load().map(uid));
  for (const id of new Set([...Object.keys(alarms), ...activeAlarmAlerts.keys()])) {
    if (!savedIds.has(id) || nextAlarms[id] !== true || nextSessions[id] !== alarmSessions[id]) {
      const oldSession = alarmSessions[id];
      stopAlarmAlert(id); clearAlarmFallbackTimers(id); cancelExternalAlarm(id, oldSession);
    }
  }
  alarms = nextAlarms; alarmSessions = nextSessions; alarmPlans = loadAlarmPlans();
  items.forEach(it => updateAlarmButton(uid(it))); updateInfoBar();
}
window.addEventListener('storage', event => {
  if (event.key === null || [ALARM_KEY, ALARM_SESSION_KEY, ALARM_PLAN_KEY, KEY].includes(event.key)) syncAlarmStateFromStorage();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', event => {
  const data = event.data || {};
  if (data.type !== 'VERIFY_ARRIVAL_ALARM') return;
  const allowed = prefs.notificationsEnabled !== false && isAlarmSessionActive(data.alarmId, data.session)
    && activeAlarmAlerts.get(data.alarmId)?.session === data.session;
  event.ports?.[0]?.postMessage({ allowed });
});
/* ===================================================================
   BOOT
   =================================================================== */
shell();
startLoop();
scheduleBusSaver();
window.setTimeout(openTour, 450);
</script>
